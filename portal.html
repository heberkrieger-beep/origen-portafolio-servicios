<!DOCTYPE html>
<!-- Portal ORIGEN — v2.0 · 2026-11-17 · app instalable (PWA), panel de equipo (Hoy, Calendario, Tareas, Clientes), asistente DeepSeek y vista de cliente -->
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0B0B0A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ORIGEN">
<title>Portal · ORIGEN</title>
<link rel="manifest" href="portal.webmanifest">
<link rel="icon" href="portal-192.png">
<link rel="apple-touch-icon" href="portal-apple.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0B0B0A;--s1:#141412;--s2:#1B1A17;--s3:#25241F;--tx:#F3EEE3;--mut:#A59D90;--gold:#C9B37A;--gold2:#E2CC92;--line:rgba(255,255,255,.08);--ok:#8FCB9B;--warn:#E9B872;--bad:#F08A80;--r:18px;--nav:68px;--safe:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:400 1rem/1.5 Jost,system-ui,sans-serif;min-height:100dvh}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--gold2)}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:6px}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:-999px;top:0;background:var(--gold);color:#111;padding:.5rem 1rem;z-index:99}.skip:focus{left:1rem}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}

/* ---------- estructura ---------- */
.side{position:fixed;inset:0 auto 0 0;width:236px;padding:22px 14px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:18px;background:var(--bg);z-index:10}
.brand{display:flex;align-items:center;gap:.6rem;color:var(--tx);text-decoration:none;font-family:Anton,sans-serif;letter-spacing:.08em;font-size:1.15rem;padding:0 8px}
.brand img{width:34px;height:34px;border-radius:10px}
#nav{display:flex;flex-direction:column;gap:4px}
#nav a{display:flex;align-items:center;gap:.8rem;padding:.7rem .9rem;border-radius:12px;color:var(--mut);text-decoration:none;font-weight:500}
#nav a:hover{background:var(--s1);color:var(--tx)}
#nav a[aria-current=page]{background:var(--s2);color:var(--tx)}
#nav a[aria-current=page] svg{color:var(--gold)}
.side-foot{margin-top:auto;display:grid;gap:8px;font-size:.85rem;color:var(--mut);padding:0 8px;overflow-wrap:anywhere}
.content{margin-left:236px;min-height:100dvh}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:1rem;padding:28px 32px 10px;max-width:1160px}
.top h1{font-family:Anton,sans-serif;font-weight:400;font-size:clamp(1.9rem,4vw,2.7rem);line-height:1.05;letter-spacing:.015em;margin:0;overflow-wrap:anywhere}
.kicker{margin:0 0 .25rem;color:var(--mut);font-size:.92rem}
#cuenta{display:none}
main{padding:12px 32px 120px;max-width:1160px}
main:focus{outline:none}
#banner{margin:0 32px 8px;max-width:1096px;background:linear-gradient(90deg,rgba(201,179,122,.18),rgba(201,179,122,.06));border:1px solid rgba(201,179,122,.35);border-radius:14px;padding:.6rem .9rem;display:flex;gap:.8rem;align-items:center;justify-content:space-between;flex-wrap:wrap;font-size:.92rem}
#fab{position:fixed;right:28px;bottom:28px;z-index:12;display:flex;align-items:center;gap:.5rem;border:0;border-radius:999px;padding:.85rem 1.3rem;background:linear-gradient(135deg,var(--gold2),var(--gold));color:#15130f;font-weight:600;box-shadow:0 10px 30px rgba(201,179,122,.25);cursor:pointer}
@media(max-width:899px){
  .side{inset:auto 0 0 0;width:auto;height:calc(var(--nav) + var(--safe));padding:6px 6px var(--safe);flex-direction:row;border-right:0;border-top:1px solid var(--line);background:rgba(11,11,10,.9);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
  .brand,.side-foot{display:none}
  #nav{flex-direction:row;flex:1;justify-content:space-around;gap:0}
  #nav a{flex-direction:column;gap:2px;padding:.45rem .2rem;font-size:.7rem;flex:1;text-align:center;border-radius:12px}
  #nav a[aria-current=page]{background:transparent}
  #nav.con-fab a:nth-child(2){margin-right:34px}#nav.con-fab a:nth-child(3){margin-left:34px}
  .content{margin-left:0}
  .top{padding:calc(16px + env(safe-area-inset-top,0px)) 16px 6px;align-items:center}
  #cuenta{display:flex;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--s2);align-items:center;justify-content:center;font-weight:600;color:var(--gold);cursor:pointer;flex:0 0 auto;padding:0}
  main{padding:8px 16px calc(var(--nav) + var(--safe) + 40px)}
  #banner{margin:0 16px 8px}
  #fab{left:50%;right:auto;transform:translateX(-50%);bottom:calc(var(--safe) + 14px);width:58px;height:58px;padding:0;justify-content:center;border:4px solid var(--bg)}
  #fab span{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
}

/* ---------- piezas ---------- */
.card{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:14px}
.card h2{font-size:1.02rem;font-weight:600;margin:0 0 .7rem;display:flex;align-items:center;justify-content:space-between;gap:.6rem;flex-wrap:wrap}
.card h2 small{font-weight:400;color:var(--mut);font-size:.85rem}
.grid{display:grid;gap:14px}
.grid>*{min-width:0}
@media(min-width:900px){.g2{grid-template-columns:1fr 1fr}.g32{grid-template-columns:3fr 2fr}}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:14px}
.stat{background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:14px 16px;text-decoration:none;color:var(--tx);display:block}
a.stat:hover{background:var(--s2)}
.stat b{display:block;font-family:Anton,sans-serif;font-weight:400;font-size:2rem;line-height:1.1;letter-spacing:.02em}
.stat span{font-size:.85rem;color:var(--mut)}
.stat.alerta b{color:var(--bad)}.stat.oro b{color:var(--gold)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.45rem;border:0;border-radius:999px;padding:.6rem 1.15rem;min-height:44px;background:var(--gold);color:#15130f;font-weight:600;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--gold2)}
.btn.ol{background:transparent;color:var(--tx);border:1px solid rgba(255,255,255,.16)}
.btn.ol:hover{background:var(--s2)}
.btn.sm{min-height:36px;padding:.35rem .85rem;font-size:.9rem}
.btn.ghost{background:transparent;color:var(--mut)}
.btn.peligro{background:transparent;color:var(--bad);border:1px solid rgba(240,138,128,.4)}
.btn[disabled]{opacity:.5;cursor:wait}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:end}
.row>label{flex:1 1 150px}
label{display:grid;gap:.3rem;font-size:.82rem;color:var(--mut);font-weight:500}
input,select,textarea{width:100%;min-width:0;background:var(--s2);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:.6rem .75rem;color:var(--tx);min-height:44px}
input:focus,select:focus,textarea:focus{border-color:var(--gold);outline:none;box-shadow:0 0 0 3px rgba(201,179,122,.2)}
[aria-invalid=true]{border-color:var(--bad)!important}
textarea{min-height:96px;resize:vertical;line-height:1.45}
input[type=checkbox]{appearance:none;-webkit-appearance:none;width:24px;height:24px;min-height:0;padding:0;border-radius:8px;border:2px solid rgba(255,255,255,.3);background:transparent;cursor:pointer;flex:0 0 auto;display:grid;place-content:center;margin:0}
input[type=checkbox]:checked{background:var(--gold);border-color:var(--gold)}
input[type=checkbox]:checked::after{content:"";width:6px;height:11px;border:solid #15130f;border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.chk{display:flex;align-items:center;gap:.6rem;color:var(--tx);font-size:.95rem;cursor:pointer}
.seg{display:inline-flex;background:var(--s2);border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;color:var(--mut);border-radius:999px;padding:.3rem .9rem;cursor:pointer;min-height:32px;font-size:.88rem}
.seg button[aria-pressed=true]{background:var(--tx);color:#111;font-weight:600}
.pill{display:inline-flex;align-items:center;gap:.35rem;font-size:.78rem;color:var(--mut);border-radius:999px;padding:.1rem .55rem;background:var(--s3);white-space:nowrap;font-weight:500}
.pill .d{width:8px;height:8px;border-radius:50%;background:var(--c,var(--mut))}
.pill.ok{color:var(--ok)}.pill.warn{color:var(--warn)}.pill.bad{color:var(--bad)}.pill.oro{color:var(--gold)}
.vacio{color:var(--mut);font-size:.95rem;margin:.3rem 0}
.mut{color:var(--mut)}
.pre{white-space:pre-wrap;background:var(--s2);border-radius:12px;padding:.7rem .85rem;margin:.3rem 0 .8rem;overflow-wrap:anywhere}

/* tareas */
ul.tasks{list-style:none;margin:0;padding:0}
.task{display:flex;align-items:flex-start;gap:.75rem;padding:.7rem 0;border-bottom:1px solid var(--line)}
.task:last-child{border-bottom:0}
.task>input{margin-top:2px}
.task-main{flex:1;min-width:0;text-align:left;background:none;border:0;padding:0;cursor:pointer;color:var(--tx);display:block}
.task-main .tt,.tt{display:block;font-weight:500;overflow-wrap:anywhere}
.task-meta{display:flex;flex-wrap:wrap;gap:.35rem;margin-top:.3rem}
.task.done .tt{text-decoration:line-through;color:var(--mut)}
.grupo{font-size:.76rem;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);margin:1rem 0 .1rem}
.grupo:first-child{margin-top:0}
.grupo.bad{color:var(--bad)}

/* agenda */
.ag-dia{font-size:.8rem;color:var(--mut);text-transform:capitalize;margin:.9rem 0 .35rem}
.ag-dia:first-of-type{margin-top:0}
.item{display:flex;align-items:center;gap:.7rem;width:100%;text-align:left;background:var(--s2);border:0;border-left:3px solid var(--c,var(--mut));border-radius:10px;padding:.55rem .75rem;margin-bottom:6px;color:var(--tx);cursor:pointer;text-decoration:none}
.item:hover{background:var(--s3)}
.item .ico{width:1.2rem;text-align:center;flex:0 0 auto}
.item .tx{flex:1;min-width:0;overflow-wrap:anywhere}
.item .tx small{display:block;color:var(--mut);font-size:.78rem}

/* calendario */
.calbar{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.calbar h2{margin:0 auto 0 0;text-transform:capitalize;font-size:1.25rem;font-weight:600}
.calbar select{width:auto;min-height:38px;padding:.3rem .6rem}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.cal .dw{font-size:.72rem;color:var(--mut);text-align:center;text-transform:uppercase;letter-spacing:.06em}
.day{background:var(--s1);border:1px solid var(--line);border-radius:12px;min-height:104px;padding:5px;display:flex;flex-direction:column;gap:3px;min-width:0}
.day.out{opacity:.3}.day.today{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}
.day-h{display:flex;justify-content:space-between;align-items:center;font-size:.78rem;color:var(--mut);padding:0 2px;min-height:26px}
.day-h .wd{display:none}
.add{border:0;background:transparent;color:var(--mut);border-radius:8px;width:28px;height:26px;cursor:pointer;font-size:1.1rem;line-height:1;opacity:.5}
.add:hover,.add:focus-visible{opacity:1;background:var(--s3);color:var(--gold)}
.chip{display:block;width:100%;text-align:left;font-size:.74rem;line-height:1.3;border:0;border-radius:6px;padding:.22rem .4rem;background:var(--s3);color:var(--tx);cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border-left:3px solid var(--c,var(--mut))}
.chip.hecho{opacity:.55;text-decoration:line-through}
@media(max-width:760px){
  .cal{grid-template-columns:1fr;gap:8px}.cal .dw,.day.out,.day.vacio-d{display:none}
  .day{min-height:0;padding:10px}.day-h{font-size:.9rem;color:var(--tx);text-transform:capitalize}.day-h .wd{display:inline}
  .add{opacity:1}
  .chip{font-size:.92rem;white-space:normal;padding:.45rem .6rem}
}
.leyenda{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:12px}

/* clientes */
.clis{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.cli{display:block;background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:16px;text-decoration:none;color:var(--tx);border-top:3px solid var(--c)}
.cli:hover{background:var(--s2)}
.cli h3{margin:0 0 .2rem;font-size:1.1rem;font-weight:600}
.cli .task-meta{margin-top:.7rem}
details.box{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);margin-bottom:12px}
details.box>summary{cursor:pointer;padding:15px 18px;font-weight:600;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:1rem}
details.box>summary::-webkit-details-marker{display:none}
details.box>summary>span:first-child{margin-right:auto}
details.box>summary::after{content:"+";color:var(--gold);font-size:1.3rem;line-height:1}
details.box[open]>summary::after{content:"–"}
details.box>div{padding:0 18px 18px}
.li{border-top:1px solid var(--line);padding:.8rem 0}
.li:first-child{border-top:0}

/* asistente */
.asis{background:radial-gradient(120% 140% at 0% 0%,rgba(201,179,122,.16),transparent 55%),var(--s1);border:1px solid rgba(201,179,122,.28)}
.asis textarea{min-height:84px;background:rgba(0,0,0,.25)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:.6rem 0}
.chips button{border:1px solid var(--line);background:var(--s2);color:var(--mut);border-radius:999px;padding:.3rem .75rem;font-size:.82rem;cursor:pointer;text-align:left}
.chips button:hover{color:var(--tx)}
.prop{display:grid;gap:8px;margin-top:.6rem}
.acc{background:var(--s2);border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:grid;grid-template-columns:auto 1fr;gap:6px 10px;align-items:start}
.acc.off{opacity:.45}
.acc .campos{display:grid;gap:6px;min-width:0}
.acc .row>*{flex:1 1 140px}
.acc input:not([type=checkbox]),.acc select{min-height:38px;padding:.35rem .6rem;font-size:.92rem}
.tipo-t{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--gold)}
.mic[aria-pressed=true]{background:var(--bad);color:#111;border-color:var(--bad)}

/* métricas */
svg.chart{width:100%;height:auto;display:block;max-height:280px}
svg.chart text{fill:var(--mut);font:12px Jost,sans-serif}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{text-align:left;padding:.5rem;border-bottom:1px solid var(--line);vertical-align:top}
thead th{font-size:.72rem;color:var(--mut);text-transform:uppercase;letter-spacing:.06em;font-weight:500}
tbody th{font-weight:500;text-transform:capitalize}
.num{text-align:right;font-variant-numeric:tabular-nums}
.up{color:var(--ok)}.down{color:var(--bad)}

/* hoja (dialog) */
dialog{background:var(--s1);color:var(--tx);border:1px solid var(--line);border-radius:22px;padding:0;width:min(620px,calc(100vw - 32px));max-height:calc(100dvh - 40px)}
dialog::backdrop{background:rgba(0,0,0,.65);backdrop-filter:blur(3px)}
.sh-h{display:flex;justify-content:space-between;align-items:center;gap:1rem;padding:16px 18px 6px;position:sticky;top:0;background:var(--s1);z-index:1}
.sh-h h2{margin:0;font-size:1.15rem;font-weight:600}
.sh-b{padding:6px 18px 22px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form>*{min-width:0}
.form .full,.form .chk{grid-column:1/-1}
.form-acc{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.tipos{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tipos button{display:flex;flex-direction:column;align-items:flex-start;gap:.15rem;background:var(--s2);border:1px solid var(--line);border-radius:16px;padding:14px;color:var(--tx);cursor:pointer;text-align:left;font-weight:500}
.tipos button:hover{border-color:var(--gold)}
.tipos b{font-size:1.4rem;color:var(--gold)}
.tipos small{color:var(--mut);font-weight:400}
@media(max-width:600px){
  dialog{width:100%;max-width:100%;margin:auto 0 0;border-radius:22px 22px 0 0;max-height:92dvh;padding-bottom:var(--safe)}
  .form{grid-template-columns:1fr}
}

/* login */
.login{min-height:100dvh;display:grid;place-items:center;padding:24px 16px;background:radial-gradient(80% 60% at 50% 0%,rgba(201,179,122,.14),transparent 70%)}
.login-in{width:min(420px,100%)}
.login img{width:64px;height:64px;border-radius:18px;margin-bottom:18px}
.login h1{font-family:Anton,sans-serif;font-weight:400;font-size:2.4rem;line-height:1.05;margin:0 0 .5rem;letter-spacing:.02em}
#toast{position:fixed;left:50%;bottom:calc(var(--nav) + var(--safe) + 24px);transform:translateX(-50%);background:var(--tx);color:#111;border-radius:14px;padding:.7rem 1.1rem;max-width:calc(100vw - 32px);font-weight:500;z-index:50;box-shadow:0 10px 30px rgba(0,0,0,.45)}
@media(min-width:900px){#toast{bottom:28px}}
#toast.bad{background:var(--bad)}
#toast:empty{display:none}
#cargando{display:grid;place-items:center;min-height:100dvh;color:var(--mut);margin:0}
@media (prefers-reduced-motion:no-preference){#view>*{animation:in .28s ease both}@keyframes in{from{opacity:0;transform:translateY(5px)}}}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js" integrity="sha384-TcHRA3zBbn+Lexh5n+Oil4guNPOS3rjNDpGRAN46u/s/mB2IZ50ceC6TYDU2yvgK" crossorigin="anonymous" defer></script>
</head>
<body>
<a class="skip" href="#main">Saltar al contenido</a>
<p id="cargando" role="status">Cargando…</p>

<section id="login" class="login" hidden aria-labelledby="t-login">
  <div class="login-in">
    <img src="portal-192.png" alt="" width="64" height="64">
    <h1 id="t-login">Tu portal ORIGEN</h1>
    <p class="mut">Calendario, métricas, reportes y todo lo que estamos haciendo por tu marca. En tu celular, como una app.</p>
    <form id="f-login" class="card" novalidate style="margin-top:18px">
      <label>Tu email
        <input type="email" name="email" id="email" autocomplete="email" required maxlength="160" inputmode="email">
      </label>
      <button class="btn" type="submit" style="width:100%;margin-top:12px">Enviarme el enlace para entrar</button>
      <p id="login-msg" role="status" aria-live="polite" style="margin:.8rem 0 0;font-size:.92rem"></p>
    </form>
    <p class="mut" style="font-size:.85rem">Sin contraseñas: te llega un enlace por email. ¿No tenés acceso? <a href="https://wa.me/5493757656783" rel="noopener">Escribinos</a>.</p>
  </div>
</section>

<div id="shell" hidden>
  <aside class="side">
    <a class="brand" href="#/"><img src="portal-192.png" alt="" width="34" height="34">ORIGEN</a>
    <nav id="nav" aria-label="Secciones"></nav>
    <div class="side-foot">
      <button class="btn ol sm" id="instalar" type="button" hidden>Instalar app</button>
      <span id="who"></span>
      <button class="btn ghost sm" id="salir" type="button" style="justify-content:flex-start;padding-left:0">Salir</button>
    </div>
  </aside>
  <div class="content">
    <header class="top">
      <div style="min-width:0"><p class="kicker" id="kicker"></p><h1 id="titulo"></h1></div>
      <div class="row" style="flex-wrap:nowrap;align-items:center"><div id="top-extra"></div><button id="cuenta" type="button" aria-label="Mi cuenta"></button></div>
    </header>
    <div id="banner" hidden></div>
    <main id="main" tabindex="-1"><div id="view"></div></main>
  </div>
  <button id="fab" type="button" hidden aria-label="Abrir asistente"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l1.8 4.7 4.7 1.8-4.7 1.8L12 16l-1.8-4.7-4.7-1.8 4.7-1.8z"/><path d="M19 15l.8 2.2 2.2.8-2.2.8L19 21l-.8-2.2-2.2-.8 2.2-.8z"/></svg><span>Asistente</span></button>
</div>

<dialog id="sheet" aria-labelledby="sh-t">
  <div class="sh-h"><h2 id="sh-t"></h2><button class="btn ghost sm" type="button" id="sh-x" aria-label="Cerrar">✕</button></div>

      h('label',{}, 'Mes', h('select',{name:'mes'}, MESES.map((n,i) => h('option',{value:i+1, selected:i+1 === ma}, n)))),
      h('label',{}, 'Red', h('select',{name:'red'}, opLista(['instagram','facebook','tiktok','youtube']).map(([v,t]) => h('option',{value:v}, t))))),
    h('div',{class:'row',style:'margin-top:10px'}, N.map(([k,t]) => h('label',{style:'flex:1 1 130px'}, t, h('input',{type:'number',name:k,min: k === 'nuevos' ? null : '0',inputmode:'numeric'})))),

    h('label',{style:'margin-top:10px'}, 'Comentario para el cliente', h('textarea',{name:'notas',maxlength:'1500',style:'min-height:70px'})),
    h('button',{class:'btn',type:'submit',style:'margin-top:12px'}, 'Guardar métricas'),
    h('p',{class:'mut',style:'font-size:.85rem'}, 'Si ese mes y red ya existen, se actualizan.'));
  const precargar = () => { const r = met.find(x => x.anio === +f.anio.value && x.mes === +f.mes.value && x.red === f.red.value); for (const [k] of N) f[k].value = r?.[k] ?? ''; f.mejor_post_url.value = r?.mejor_post_url || ''; f.notas.value = r?.notas || ''; };
  for (const k of ['anio','mes','red']) f[k].addEventListener('change', precargar);

  f.addEventListener('submit', async e => {
    e.preventDefault(); if (!validar(f)) return;
    const row = { cliente_id:id, anio:+f.anio.value, mes:+f.mes.value, red:f.red.value, mejor_post_url:httpUrl(f.mejor_post_url.value.trim()), notas:f.notas.value.trim() || null };

function micBtn(ta){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) return null;
  const b = h('button',{type:'button',class:'btn ol mic','aria-pressed':'false'}, '🎙 Dictar');
  let rec = null;
  b.addEventListener('click', () => {
    if (rec){ rec.stop(); return; }
    rec = new SR(); rec.lang = 'es-AR'; rec.interimResults = true; rec.continuous = true;
    const base = ta.value ? ta.value.trimEnd() + ' ' : '';
    rec.onresult = e => { ta.value = base + [...e.results].map(r => r[0].transcript).join(' '); };
    rec.onend = () => { rec = null; b.setAttribute('aria-pressed','false'); b.textContent = '🎙 Dictar'; };
    rec.onerror = ev => { if (ev.error !== 'aborted') toast('No pude usar el micrófono.', true); };
    rec.start(); b.setAttribute('aria-pressed','true'); b.textContent = '■ Parar';
  });
  return b;
}
async function ordenar(ta, out, btn){
  const texto = ta.value.trim();
  if (!texto){ ta.setAttribute('aria-invalid','true'); ta.focus(); return; }
  ta.removeAttribute('aria-invalid');
  fill(out, h('p',{class:'mut'}, '✦ Ordenando… (puede tardar unos segundos)'));
  await ocupado(btn, async () => {
    const { data, error } = await sb.functions.invoke('asistente', { body:{ texto, hoy:hoyISO() } });
    if (error){
      let m = 'El asistente todavía no está activado.';
      try { m = (await error.context.json()).error || m; } catch {}
      fill(out, h('p',{class:'pre'}, m)); return;
    }
    propuesta(data, out, ta);
  });
}
const NOMBRE_ACC = { avance:'Avance · lo ve el cliente', tarea:'Tarea', contenido:'Publicación', produccion:'Producción', evento:'Reunión' };
function propuesta(data, out, ta){
  const acc = (data?.acciones || []).map(a => ({ ...a, ok:true }));
  if (!acc.length){ fill(out, h('p',{class:'pre'}, data?.dudas || data?.resumen || 'No encontré nada para registrar. Probá con más detalle.')); return; }
  const guardarBtn = h('button',{type:'button',class:'btn'});
  const contar = () => { const n = acc.filter(a => a.ok).length; guardarBtn.textContent = `Guardar ${n} ${n === 1 ? 'cosa' : 'cosas'}`; guardarBtn.disabled = !n; };
  const tarjetas = acc.map(a => {
    const cb = h('input',{type:'checkbox','aria-label':`Incluir ${NOMBRE_ACC[a.tipo]}`}); cb.checked = true;
    const t = h('input',{'aria-label': a.tipo === 'produccion' ? 'Lugar' : 'Texto', maxlength: a.tipo === 'avance' ? '200' : '140', placeholder: a.tipo === 'produccion' ? 'Lugar (opcional)' : null});
    t.value = (a.tipo === 'produccion' ? a.ubicacion : a.texto || a.titulo) || '';
    const cli = h('select',{'aria-label':'Cliente'}, opCli(a.tipo === 'contenido' || a.tipo === 'produccion')().map(([v,n]) => h('option',{value:v}, n))); cli.value = a.cliente_id || '';
    const fKey = a.tipo === 'tarea' ? 'fecha_limite' : a.tipo === 'avance' ? null : 'fecha';
    const fe = fKey ? h('input',{type:'date','aria-label':'Fecha'}) : null; if (fe) fe.value = a[fKey] || '';
    const card = h('div',{class:'acc'}, cb, h('div',{class:'campos'},
      h('span',{class:'tipo-t'}, NOMBRE_ACC[a.tipo], a.tipo === 'contenido' ? ` · ${a.red} · ${a.formato}` : '', a.hora ? ` · ${a.hora}` : ''),
      t, a.idea ? h('span',{class:'mut',style:'font-size:.85rem'}, a.idea) : null,
      h('div',{class:'row'}, cli, fe)));
    cb.addEventListener('change', () => { a.ok = cb.checked; card.classList.toggle('off', !cb.checked); contar(); });
    a.leer = () => { a.cliente_id = cli.value || null; const v = t.value.trim(); if (a.tipo === 'avance') a.texto = v; else if (a.tipo === 'produccion') a.ubicacion = v || null; else a.titulo = v; if (fKey) a[fKey] = fe.value || null; };
    return card;
  });
  contar();
  guardarBtn.addEventListener('click', () => ocupado(guardarBtn, async () => {
    const sel = acc.filter(a => a.ok); sel.forEach(a => a.leer());
    const falta = sel.find(a => (['contenido','produccion'].includes(a.tipo) && !a.cliente_id) || (a.tipo === 'avance' ? !a.texto : !a.titulo && a.tipo !== 'produccion') || (['contenido','produccion','evento'].includes(a.tipo) && !a.fecha));
    if (falta) throw aviso(`Completá cliente, texto y fecha en “${NOMBRE_ACC[falta.tipo]}”.`);
    const yo = S.yo?.id || null, ins = { tareas:[], contenidos:[], producciones:[], eventos:[] };
    for (const a of sel){
      if (a.tipo === 'avance') ins.tareas.push({ cliente_id:a.cliente_id, titulo:a.texto, texto:a.texto, texto_cliente:a.texto, hecha:true, estado:'hecha', visible_cliente:!!a.cliente_id, responsable_id:yo, prioridad:'media' });
      if (a.tipo === 'tarea') ins.tareas.push({ cliente_id:a.cliente_id, titulo:a.titulo, texto:a.titulo, fecha_limite:a.fecha_limite, responsable_id:a.responsable_id || yo, prioridad:a.prioridad || 'media', estado:'pendiente', hecha:false, visible_cliente:false });
      if (a.tipo === 'contenido') ins.contenidos.push({ cliente_id:a.cliente_id, fecha:a.fecha, red:a.red, formato:a.formato, titulo:a.titulo, idea:a.idea || null, estado:'idea', visible_cliente:false });
      if (a.tipo === 'produccion') ins.producciones.push({ cliente_id:a.cliente_id, fecha:a.fecha, hora:a.hora || null, ubicacion:a.ubicacion || null, visible_cliente:true });
      if (a.tipo === 'evento') ins.eventos.push({ cliente_id:a.cliente_id, titulo:a.titulo, fecha:a.fecha, hora:a.hora || null, tipo:a.tipo_evento || 'reunion', visible_cliente:false });
    }
    for (const [tabla, filas] of Object.entries(ins)) if (filas.length) await q(sb.from(tabla).insert(filas));
    ta.value = '';
    toast(`¡Listo! Guardé ${sel.length} ${sel.length === 1 ? 'cosa' : 'cosas'}.`);
    cerrarHoja();
    await recargar();
  }));
  fill(out, data.resumen ? h('p',{style:'margin:.9rem 0 .2rem'}, data.resumen) : null, data.dudas ? h('p',{class:'pre'}, '❓ ', data.dudas) : null,
    h('div',{class:'prop'}, tarjetas),
    h('div',{class:'row',style:'margin-top:12px'}, guardarBtn, h('button',{type:'button',class:'btn ghost',onclick:() => fill(out)}, 'Descartar')));
}

  const algo = Object.keys(porDia).some(k => enMes(k, y, m));
  fill($('view'),
    pend.length ? h('section',{class:'card asis'}, h('h2',{}, 'Para aprobar', h('small',{}, pend.length)),
      pend.map(c => h('button',{type:'button',class:'item',style:'--c:#E9B872',onclick:() => verContenido(c)}, h('span',{class:'ico','aria-hidden':'true'}, '▣'),
        h('span',{class:'tx'}, c.titulo || 'Publicación', h('small',{}, [fLarga(c.fecha), c.red, c.formato].filter(Boolean).join(' · '))), h('span',{class:'btn sm'}, 'Ver')))) : null,
    h('div',{class:'calbar'}, h('h2',{'aria-live':'polite'}, `${MESES[m]} ${y}`),
      h('button',{type:'button',class:'btn ol sm','aria-label':'Mes anterior',onclick:() => { S.mes = new Date(y, m - 1, 1); render(); }}, '‹'),
      h('button',{type:'button',class:'btn ol sm',onclick:() => { S.mes = new Date(); render(); }}, 'Hoy'),
      h('button',{type:'button',class:'btn ol sm','aria-label':'Mes siguiente',onclick:() => { S.mes = new Date(y, m + 1, 1); render(); }}, '›')),
    h('div',{class:'cal'}, celdas),
    !algo ? vacio('Todavía no hay nada agendado para este mes.') : null,
    h('div',{class:'leyenda'}, pill('Para aprobar','',col.pendiente), pill('Aprobado','',col.aprobado), pill('Pediste cambios','',col.cambios), pill('Producción','','#7FD6E8'), pill('Reunión','','#B59CF0')));
};

function verContenido(c){
  const links = (Array.isArray(c.archivos) ? c.archivos : []).map(a => httpUrl(typeof a === 'string' ? a : a?.url)).filter(Boolean);
  const coment = h('textarea',{id:'v-com',maxlength:'1000',placeholder:'Ej.: cambiar la foto de portada'});
  const puede = !S.equipo && c.estado !== 'publicado';
  const decidir = async (btn, dec) => {
    const t = coment.value.trim();
    if (dec === 'cambios' && !t){ coment.setAttribute('aria-invalid','true'); coment.focus(); toast('Contanos qué cambiar.', true); return; }
    await ocupado(btn, async () => {
      await q(sb.rpc('decidir_contenido',{ p_id:c.id, p_decision:dec, p_comentario:t || null }));
      c.aprobacion = dec; c.comentario_cliente = t || null; cerrarHoja();
      toast(dec === 'aprobado' ? '¡Aprobado! Gracias 🙌' : 'Listo, el equipo ya lo ve.'); render();
    });
  };
  abrirHoja(c.titulo || 'Publicación',
    h('p',{class:'mut',style:'margin-top:0'}, [fLarga(c.fecha), c.red, c.formato].filter(Boolean).join(' · '), ' ', pill(...APROB[c.aprobacion])),
    c.idea ? [h('h3',{style:'font-size:.9rem;margin:.6rem 0 0'}, 'Idea'), h('div',{class:'pre'}, c.idea)] : null,
    c.copy ? [h('h3',{style:'font-size:.9rem;margin:.6rem 0 0'}, 'Texto de la publicación'), h('div',{class:'pre'}, c.copy)] : null,
    links.length ? h('p',{}, links.map((u,i) => h('a',{class:'btn ol sm',href:u,target:'_blank',rel:'noopener',style:'margin:0 6px 6px 0'}, `Ver la pieza${links.length > 1 ? ' ' + (i+1) : ''}`))) : null,
    c.comentario_cliente ? h('p',{}, h('b',{}, 'Tu comentario: '), c.comentario_cliente) : null,
    puede ? [h('label',{for:'v-com',style:'margin-top:.4rem'}, '¿Algún comentario? (opcional para aprobar)'), coment,
      h('div',{class:'row',style:'margin-top:12px'},
        h('button',{type:'button',class:'btn',onclick:e => decidir(e.currentTarget,'aprobado')}, '✓ Aprobar'),
        h('button',{type:'button',class:'btn ol',onclick:e => decidir(e.currentTarget,'cambios')}, 'Pedir cambios'))]
      : S.equipo ? h('p',{class:'mut'}, 'Vista del equipo: el cliente aprueba desde su cuenta.') : null);
}

VC.metricas = () => {
  titulo('Métricas', 'Cómo le va a tu marca'); selectorNegocio();
  const C = S.C, redes = [...new Set(C.met.map(x => x.red))];
  if (!S.red || !redes.includes(S.red)) S.red = redes[0];
  const rows = C.met.filter(x => x.red === S.red).slice(-12);
  if (!rows.length){ fill($('view'), h('div',{class:'card'}, vacio('Las métricas aparecen acá apenas cerramos el primer mes.'))); return; }
  const u = rows.at(-1), p = rows.at(-2);
  const kp = (k, t) => { const d = p && u[k] != null && p[k] ? Math.round((u[k] - p[k]) / p[k] * 100) : null;
    return h('div',{class:'stat'}, h('b',{}, num(u[k])), h('span',{}, t), d != null ? h('span',{class:d >= 0 ? 'up' : 'down',style:'display:block;font-size:.82rem'}, `${d >= 0 ? '▲' : '▼'} ${Math.abs(d)}% vs. mes anterior`) : null); };
  const W = 640, H = 220, pad = 26, max = Math.max(1, ...rows.map(r => r.visualizaciones || 0)), bw = (W - pad * 2) / Math.max(rows.length, 6);
  const NS = 'http://www.w3.org/2000/svg', s = (t, a, tx) => { const e = document.createElementNS(NS, t); for (const k in a) e.setAttribute(k, a[k]); if (tx != null) e.textContent = tx; return e; };
  const svg = s('svg',{viewBox:`0 0 ${W} ${H}`,class:'chart',role:'img','aria-label':'Visualizaciones por mes: ' + rows.map(r => `${MESES[r.mes-1]} ${num(r.visualizaciones)}`).join(', ')});
  const def = s('defs',{}), gr = s('linearGradient',{id:'gbar',x1:0,y1:0,x2:0,y2:1}); gr.append(s('stop',{offset:'0','stop-color':'#E2CC92'}), s('stop',{offset:'1','stop-color':'#8a7849'})); def.append(gr); svg.append(def);
  rows.forEach((r, i) => { const v = r.visualizaciones || 0, bh = (H - pad * 2) * v / max, x = pad + i * bw + bw * .18, yb = H - pad - bh;
    svg.append(s('rect',{x, y:yb, width:bw * .64, height:Math.max(bh, 2), rx:6, fill: i === rows.length - 1 ? 'url(#gbar)' : '#3a3730'}),
      s('text',{x:x + bw * .32, y:H - 6, 'text-anchor':'middle'}, MESES[r.mes-1].slice(0,3)),
      s('text',{x:x + bw * .32, y:yb - 6, 'text-anchor':'middle'}, v >= 1000 ? Math.round(v / 1000) + 'k' : v)); });
  const sel = redes.length > 1 ? h('div',{class:'seg',role:'group','aria-label':'Red'}, redes.map(r => h('button',{type:'button','aria-pressed':String(r === S.red),onclick:() => { S.red = r; render(); }}, r[0].toUpperCase() + r.slice(1)))) : null;
  const mejor = httpUrl(u.mejor_post_url);
  const cols = [['seguidores','Seguidores'],['visualizaciones','Vistas'],['alcance','Alcance'],['interacciones','Interacc.'],['visitas_perfil','Visitas perfil'],['clics_enlace','Clics']];
  fill($('view'), sel ? h('div',{style:'margin-bottom:12px'}, sel) : null,
    h('div',{class:'stats'}, kp('visualizaciones','Visualizaciones'), kp('alcance','Cuentas alcanzadas'), kp('interacciones','Interacciones'), kp('seguidores','Seguidores')),
    (u.notas || mejor) ? h('section',{class:'card asis'}, h('h2',{}, `Comentario de ORIGEN · ${MESES[u.mes-1]}`), u.notas ? h('p',{style:'margin:0 0 .5rem'}, u.notas) : null,
      mejor ? h('a',{href:mejor,target:'_blank',rel:'noopener'}, `Ver el mejor post${u.mejor_post_vistas ? ` (${num(u.mejor_post_vistas)} vistas)` : ''} →`) : null) : null,
    h('section',{class:'card'}, h('h2',{}, 'Visualizaciones por mes'), svg),
    h('section',{class:'card tbl'}, h('h2',{}, 'Detalle'), h('table',{}, h('thead',{}, h('tr',{}, h('th',{scope:'col'}, 'Mes'), cols.map(([,t]) => h('th',{scope:'col',class:'num'}, t)))),
      h('tbody',{}, [...rows].reverse().map(r => h('tr',{}, h('th',{scope:'row'}, `${MESES[r.mes-1]} ${r.anio}`), cols.map(([k]) => h('td',{class:'num'}, num(r[k])))))))));
};

async function abrirArchivo(path, btn){
  const w = window.open('', '_blank'); if (w) w.opener = null;
  await ocupado(btn, async () => {
    try { const { signedUrl } = await q(sb.storage.from(BUCKET).createSignedUrl(path, 120)); if (w) w.location.href = signedUrl; else location.href = signedUrl; }
    catch(e){ w?.close(); throw e; }
  });
}
function archivosDe(s){ return (Array.isArray(s.archivos) ? s.archivos : []).filter(a => a?.path).map(a => h('button',{type:'button',class:'btn ol sm',style:'margin:4px 6px 0 0',onclick:e => abrirArchivo(a.path, e.currentTarget)}, '📎 ' + (a.nombre || 'archivo'))); }

VC.enviar = () => {
  titulo('Mandanos algo', 'Pedidos, fotos, datos o consultas'); selectorNegocio();
  const f = h('form',{novalidate:true},
    h('label',{}, '¿Qué nos mandás?', h('select',{name:'tipo'}, [['pedido','Un pedido (post, historia, cambio)'],['material','Material (fotos, videos, logo)'],['dato','Un dato (promo, horario, precio)'],['consulta','Una consulta']].map(([v,t]) => h('option',{value:v}, t)))),
    h('label',{style:'margin-top:10px'}, 'Mensaje *', h('textarea',{name:'mensaje',required:true,maxlength:'2000','aria-describedby':'env-cnt'})),
    h('p',{id:'env-cnt',class:'mut',style:'font-size:.8rem;text-align:right;margin:.2rem 0'}, '0 / 2000'),
    h('label',{}, 'Archivos (opcional · hasta 5, máx. 25 MB c/u)', h('input',{type:'file',name:'archivos',multiple:true,accept:'image/*,video/*,application/pdf,.zip'})),
    h('button',{class:'btn',type:'submit',style:'margin-top:14px;width:100%'}, 'Enviar a ORIGEN'));
  f.mensaje.addEventListener('input', () => $('env-cnt').textContent = `${f.mensaje.value.length} / 2000`);
  f.addEventListener('submit', async e => {
    e.preventDefault();
    const msj = f.mensaje.value.trim(), files = [...f.archivos.files];
    if (!msj){ f.mensaje.setAttribute('aria-invalid','true'); f.mensaje.focus(); return toast('Escribí un mensaje.', true); }
    f.mensaje.removeAttribute('aria-invalid');
    if (files.length > 5) return toast('Máximo 5 archivos por envío.', true);
    const g = files.find(x => x.size > MAX_MB * 1048576); if (g) return toast(`“${g.name}” pesa más de ${MAX_MB} MB.`, true);
    await ocupado(e.submitter, async () => {
      const paths = [];
      for (const x of files){ const path = `${S.cid}/material/${Date.now()}-${limpio(x.name)}`; await q(sb.storage.from(BUCKET).upload(path, x, { contentType:x.type || 'application/octet-stream' })); paths.push({ path, nombre:x.name.slice(0,120) }); }
      await q(sb.from('solicitudes').insert({ cliente_id:S.cid, tipo:f.tipo.value, mensaje:msj, archivos:paths }));
      toast('¡Recibido! Te respondemos por acá.');
      S.C.sol = await q(sb.from('solicitudes').select('*').eq('cliente_id',S.cid).order('creado_en',{ascending:false}).limit(30));
      render();
    });
  });
  fill($('view'), h('div',{class:'grid g2'}, h('section',{class:'card'}, f),
    h('section',{class:'card'}, h('h2',{}, 'Lo que nos mandaste'), S.C.sol.length ? S.C.sol.map(s => h('div',{class:'li'},
      h('div',{class:'row',style:'justify-content:space-between;align-items:center'}, h('b',{}, TIPOS_SOL[s.tipo]), pill(...SOL_EST[s.estado])),
      h('div',{class:'mut',style:'font-size:.82rem'}, fCorta(s.creado_en)), h('div',{class:'pre'}, s.mensaje), archivosDe(s),
      s.respuesta ? h('p',{style:'margin:.4rem 0 0'}, h('b',{}, 'ORIGEN: '), s.respuesta) : null)) : vacio('Todavía no nos mandaste nada.'))));
};

VC.mas = () => {
  titulo('Más', 'Reportes, tu plan y la app'); selectorNegocio();
  const C = S.C, sv = C.serv.filter(x => x.activo !== false);
  fill($('view'),
    h('section',{class:'card'}, h('h2',{}, 'Reportes mensuales'), C.rep.length ? C.rep.map(r => h('div',{class:'li row',style:'justify-content:space-between;align-items:center'},
      h('span',{}, h('b',{}, r.titulo || `Reporte de ${MESES[r.mes-1]}`), h('br'), h('span',{class:'mut',style:'font-size:.85rem'}, `${MESES[r.mes-1]} ${r.anio}`)),
      h('button',{type:'button',class:'btn sm',onclick:e => abrirArchivo(r.archivo_path, e.currentTarget)}, 'Abrir PDF'))) : vacio('El primer reporte llega al cerrar el mes.')),
    h('div',{class:'grid g2'},
      h('section',{class:'card'}, h('h2',{}, 'Tu plan'), sv.length ? sv.map(x => h('div',{class:'li'}, h('b',{}, x.nombre), x.frecuencia ? h('span',{class:'mut'}, ' · ' + x.frecuencia) : null, x.descripcion ? h('p',{class:'mut',style:'margin:.2rem 0 0'}, x.descripcion) : null)) : h('p',{}, C.ficha?.plan || 'Plan ORIGEN'),
        C.ficha?.mensual ? h('p',{style:'margin-top:.8rem'}, 'Abono mensual: ', h('b',{}, pesos(C.ficha.mensual)), C.ficha.dia_cobro ? ` · se cobra el día ${C.ficha.dia_cobro}` : '') : null),
      h('section',{class:'card tbl'}, h('h2',{}, 'Pagos registrados'), C.pag.length ? h('table',{}, h('thead',{}, h('tr',{}, h('th',{scope:'col'}, 'Fecha'), h('th',{scope:'col',class:'num'}, 'Monto'), h('th',{scope:'col'}, 'Detalle'))),
        h('tbody',{}, C.pag.map(p => h('tr',{}, h('td',{}, fCorta(p.fecha)), h('td',{class:'num'}, pesos(p.monto)), h('td',{}, p.nota || ''))))) : vacio('Sin pagos registrados.'))),
    h('section',{class:'card'}, h('h2',{}, 'Tu portal en el celular'),
      S.instalar ? h('button',{type:'button',class:'btn',onclick:instalarApp}, 'Instalar la app') : (ayudaIOS() || h('p',{class:'mut',style:'margin:0'}, 'En Android: menú ⋮ del navegador → “Instalar app” o “Agregar a pantalla de inicio”.')),
      h('div',{class:'row',style:'margin-top:12px'}, h('a',{class:'btn ol',href:WA,rel:'noopener'}, 'WhatsApp de ORIGEN'), h('button',{type:'button',class:'btn ghost',onclick:salir}, 'Salir'))));
};
});
</script>
