<!DOCTYPE html>
<!-- Portal ORIGEN — v3.4 · 2026-11-18 · diseño de vidrio oscuro con dorado, acceso con usuario y clave creados por el equipo, métricas cargadas visibles -->
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0B0B0A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ORIGEN">
<title>Portal · ORIGEN</title>
<link rel="manifest" href="portal.webmanifest">
<link rel="icon" href="portal-192.png">
<link rel="apple-touch-icon" href="portal-apple.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0B0B0A;--s1:#141412;--s2:#1B1A17;--s3:#25241F;--tx:#F3EEE3;--mut:#A59D90;--gold:#C9B37A;--gold2:#E2CC92;--line:rgba(255,255,255,.08);--ok:#8FCB9B;--warn:#E9B872;--bad:#F08A80;--r:18px;--nav:68px;--safe:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:400 1rem/1.5 Jost,system-ui,sans-serif;min-height:100dvh}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--gold2)}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:6px}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:-999px;top:0;background:var(--gold);color:#111;padding:.5rem 1rem;z-index:99}.skip:focus{left:1rem}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}

/* ---------- estructura ---------- */
.side{position:fixed;inset:0 auto 0 0;width:236px;padding:22px 14px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:18px;background:var(--bg);z-index:10}
.brand{display:flex;align-items:center;gap:.6rem;color:var(--tx);text-decoration:none;font-family:Anton,sans-serif;letter-spacing:.08em;font-size:1.15rem;padding:0 8px}
.brand img{width:34px;height:34px;border-radius:10px}
#nav{display:flex;flex-direction:column;gap:4px}
#nav a{display:flex;align-items:center;gap:.8rem;padding:.7rem .9rem;border-radius:12px;color:var(--mut);text-decoration:none;font-weight:500}
#nav a:hover{background:var(--s1);color:var(--tx)}
#nav a[aria-current=page]{background:var(--s2);color:var(--tx)}
#nav a[aria-current=page] svg{color:var(--gold)}
.side-foot{margin-top:auto;display:grid;gap:8px;font-size:.85rem;color:var(--mut);padding:0 8px;overflow-wrap:anywhere}
.content{margin-left:236px;min-height:100dvh}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:1rem;padding:28px 32px 10px;max-width:1160px}
.top h1{font-family:Anton,sans-serif;font-weight:400;font-size:clamp(1.9rem,4vw,2.7rem);line-height:1.05;letter-spacing:.015em;margin:0;overflow-wrap:anywhere}
.kicker{margin:0 0 .25rem;color:var(--mut);font-size:.92rem}
#cuenta{display:none}
main{padding:12px 32px 120px;max-width:1160px}
main:focus{outline:none}
#banner{margin:0 32px 8px;max-width:1096px;background:linear-gradient(90deg,rgba(201,179,122,.18),rgba(201,179,122,.06));border:1px solid rgba(201,179,122,.35);border-radius:14px;padding:.6rem .9rem;display:flex;gap:.8rem;align-items:center;justify-content:space-between;flex-wrap:wrap;font-size:.92rem}
#fab{position:fixed;right:28px;bottom:28px;z-index:12;display:flex;align-items:center;gap:.5rem;border:0;border-radius:999px;padding:.85rem 1.3rem;background:linear-gradient(135deg,var(--gold2),var(--gold));color:#15130f;font-weight:600;box-shadow:0 10px 30px rgba(201,179,122,.25);cursor:pointer}
@media(max-width:899px){
  .side{inset:auto 0 0 0;width:auto;height:calc(var(--nav) + var(--safe));padding:6px 6px var(--safe);flex-direction:row;border-right:0;border-top:1px solid var(--line);background:rgba(11,11,10,.9);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
  .brand,.side-foot{display:none}
  #nav{flex-direction:row;flex:1;justify-content:space-around;gap:0}
  #nav a{flex-direction:column;gap:2px;padding:.45rem .2rem;font-size:.7rem;flex:1;text-align:center;border-radius:12px}
  #nav a[aria-current=page]{background:transparent}
  #nav.con-fab a:nth-child(2){margin-right:34px}#nav.con-fab a:nth-child(3){margin-left:34px}
  .content{margin-left:0}
  .top{padding:calc(16px + env(safe-area-inset-top,0px)) 16px 6px;align-items:center}
  #cuenta{display:flex;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--s2);align-items:center;justify-content:center;font-weight:600;color:var(--gold);cursor:pointer;flex:0 0 auto;padding:0}
  main{padding:8px 16px calc(var(--nav) + var(--safe) + 40px)}
  #banner{margin:0 16px 8px}
  #fab{left:50%;right:auto;transform:translateX(-50%);bottom:calc(var(--safe) + 14px);width:58px;height:58px;padding:0;justify-content:center;border:4px solid var(--bg)}
  #fab span{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
}

/* ---------- piezas ---------- */
.card{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:14px}
.card h2{font-size:1.02rem;font-weight:600;margin:0 0 .7rem;display:flex;align-items:center;justify-content:space-between;gap:.6rem;flex-wrap:wrap}
.card h2 small{font-weight:400;color:var(--mut);font-size:.85rem}
.grid{display:grid;gap:14px}
.grid>*{min-width:0}
@media(min-width:900px){.g2{grid-template-columns:1fr 1fr}.g32{grid-template-columns:3fr 2fr}}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:14px}
.stat{background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:14px 16px;text-decoration:none;color:var(--tx);display:block}
a.stat:hover{background:var(--s2)}
.stat b{display:block;font-family:Anton,sans-serif;font-weight:400;font-size:2rem;line-height:1.1;letter-spacing:.02em}
.stat span{font-size:.85rem;color:var(--mut)}
.stat.alerta b{color:var(--bad)}.stat.oro b{color:var(--gold)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.45rem;border:0;border-radius:999px;padding:.6rem 1.15rem;min-height:44px;background:var(--gold);color:#15130f;font-weight:600;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--gold2)}
.btn.ol{background:transparent;color:var(--tx);border:1px solid rgba(255,255,255,.16)}
.btn.ol:hover{background:var(--s2)}
.btn.sm{min-height:36px;padding:.35rem .85rem;font-size:.9rem}
.btn.ghost{background:transparent;color:var(--mut)}
.btn.peligro{background:transparent;color:var(--bad);border:1px solid rgba(240,138,128,.4)}
.btn[disabled]{opacity:.5;cursor:wait}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:end}
.row>label{flex:1 1 150px}
label{display:grid;gap:.3rem;font-size:.82rem;color:var(--mut);font-weight:500}
input,select,textarea{width:100%;min-width:0;background:var(--s2);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:.6rem .75rem;color:var(--tx);min-height:44px}
input:focus,select:focus,textarea:focus{border-color:var(--gold);outline:none;box-shadow:0 0 0 3px rgba(201,179,122,.2)}
[aria-invalid=true]{border-color:var(--bad)!important}
textarea{min-height:96px;resize:vertical;line-height:1.45}
input[type=checkbox]{appearance:none;-webkit-appearance:none;width:24px;height:24px;min-height:0;padding:0;border-radius:8px;border:2px solid rgba(255,255,255,.3);background:transparent;cursor:pointer;flex:0 0 auto;display:grid;place-content:center;margin:0}
input[type=checkbox]:checked{background:var(--gold);border-color:var(--gold)}
input[type=checkbox]:checked::after{content:"";width:6px;height:11px;border:solid #15130f;border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.chk{display:flex;align-items:center;gap:.6rem;color:var(--tx);font-size:.95rem;cursor:pointer}
.seg{display:inline-flex;background:var(--s2);border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;color:var(--mut);border-radius:999px;padding:.3rem .9rem;cursor:pointer;min-height:32px;font-size:.88rem}
.seg button[aria-pressed=true]{background:var(--tx);color:#111;font-weight:600}
.pill{display:inline-flex;align-items:center;gap:.35rem;font-size:.78rem;color:var(--mut);border-radius:999px;padding:.1rem .55rem;background:var(--s3);white-space:nowrap;font-weight:500}
.pill .d{width:8px;height:8px;border-radius:50%;background:var(--c,var(--mut))}
.pill.ok{color:var(--ok)}.pill.warn{color:var(--warn)}.pill.bad{color:var(--bad)}.pill.oro{color:var(--gold)}
.vacio{color:var(--mut);font-size:.95rem;margin:.3rem 0}
.mut{color:var(--mut)}
.pre{white-space:pre-wrap;background:var(--s2);border-radius:12px;padding:.7rem .85rem;margin:.3rem 0 .8rem;overflow-wrap:anywhere}

/* tareas */
ul.tasks{list-style:none;margin:0;padding:0}
.task{display:flex;align-items:flex-start;gap:.75rem;padding:.7rem 0;border-bottom:1px solid var(--line)}
.task:last-child{border-bottom:0}
.task>input{margin-top:2px}
.task-main{flex:1;min-width:0;text-align:left;background:none;border:0;padding:0;cursor:pointer;color:var(--tx);display:block}
.task-main .tt,.tt{display:block;font-weight:500;overflow-wrap:anywhere}
.task-meta{display:flex;flex-wrap:wrap;gap:.35rem;margin-top:.3rem}
.task.done .tt{text-decoration:line-through;color:var(--mut)}
.grupo{font-size:.76rem;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);margin:1rem 0 .1rem}
.grupo:first-child{margin-top:0}
.grupo.bad{color:var(--bad)}

/* agenda */
.ag-dia{font-size:.8rem;color:var(--mut);text-transform:capitalize;margin:.9rem 0 .35rem}
.ag-dia:first-of-type{margin-top:0}
.item{display:flex;align-items:center;gap:.7rem;width:100%;text-align:left;background:var(--s2);border:0;border-left:3px solid var(--c,var(--mut));border-radius:10px;padding:.55rem .75rem;margin-bottom:6px;color:var(--tx);cursor:pointer;text-decoration:none}
.item:hover{background:var(--s3)}
.item .ico{width:1.2rem;text-align:center;flex:0 0 auto}
.item .tx{flex:1;min-width:0;overflow-wrap:anywhere}
.item .tx small{display:block;color:var(--mut);font-size:.78rem}

/* calendario */
.calbar{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.calbar h2{margin:0 auto 0 0;text-transform:capitalize;font-size:1.25rem;font-weight:600}
.calbar select{width:auto;min-height:38px;padding:.3rem .6rem}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.cal .dw{font-size:.72rem;color:var(--mut);text-align:center;text-transform:uppercase;letter-spacing:.06em}
.day{background:var(--s1);border:1px solid var(--line);border-radius:12px;min-height:104px;padding:5px;display:flex;flex-direction:column;gap:3px;min-width:0}
.day.out{opacity:.3}.day.today{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}
.day-h{display:flex;justify-content:space-between;align-items:center;font-size:.78rem;color:var(--mut);padding:0 2px;min-height:26px}
.day-h .wd{display:none}
.add{border:0;background:transparent;color:var(--mut);border-radius:8px;width:28px;height:26px;cursor:pointer;font-size:1.1rem;line-height:1;opacity:.5}
.add:hover,.add:focus-visible{opacity:1;background:var(--s3);color:var(--gold)}
.chip{display:block;width:100%;text-align:left;font-size:.74rem;line-height:1.3;border:0;border-radius:6px;padding:.22rem .4rem;background:var(--s3);color:var(--tx);cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border-left:3px solid var(--c,var(--mut))}
.chip.hecho{opacity:.55;text-decoration:line-through}
.dnum{border:0;background:none;color:inherit;font:inherit;padding:0 4px;cursor:pointer;min-width:26px;min-height:26px;border-radius:8px}
.day.today .dnum{color:var(--gold);font-weight:700}
.dots,.dia-panel{display:none}
@media(max-width:760px){
  .cal{gap:3px}.cal .dw{font-size:.62rem;letter-spacing:0}
  .day{min-height:56px;padding:4px 2px;border-radius:10px;cursor:pointer;align-items:center;gap:2px}
  .day-h{justify-content:center;font-size:.85rem;min-height:0;padding:0}
  .day .chip,.day .add,.solo-pc{display:none}
  .dots{display:flex;gap:3px;flex-wrap:wrap;justify-content:center;margin-top:auto;padding-bottom:3px}
  .dots i{width:7px;height:7px;border-radius:50%;background:var(--c)}.dots b{font-size:.62rem;line-height:7px;color:var(--mut)}
  .day.sel{background:var(--s3);border-color:var(--gold)}
  .dia-panel{display:block;margin-top:12px}
}
.inst{display:flex;align-items:center;gap:12px}.inst img{border-radius:12px;flex:0 0 auto}
.alerta{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:.65rem .8rem;border-radius:12px;margin-bottom:6px;background:var(--s2);border-left:3px solid var(--warn)}
.alerta.bad{border-left-color:var(--bad)}.alerta span{flex:1}
.av{display:flex;justify-content:space-between;gap:10px;margin:.7rem 0 .3rem;font-size:.92rem}.av span{color:var(--mut)}
.barra{height:8px;border-radius:999px;background:var(--s3);overflow:hidden}.barra i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold2));border-radius:999px}
.leyenda{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:12px}

/* clientes */
.clis{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.cli{display:block;background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:16px;text-decoration:none;color:var(--tx);border-top:3px solid var(--c)}
.cli:hover{background:var(--s2)}
.cli h3{margin:0 0 .2rem;font-size:1.1rem;font-weight:600}
.cli .task-meta{margin-top:.7rem}
details.box{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);margin-bottom:12px}
details.box>summary{cursor:pointer;padding:15px 18px;font-weight:600;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:1rem}
details.box>summary::-webkit-details-marker{display:none}
details.box>summary>span:first-child{margin-right:auto}
details.box>summary::after{content:"+";color:var(--gold);font-size:1.3rem;line-height:1}
details.box[open]>summary::after{content:"–"}
details.box>div{padding:0 18px 18px}
.li{border-top:1px solid var(--line);padding:.8rem 0}
.li:first-child{border-top:0}

/* asistente */
.asis{background:radial-gradient(120% 140% at 0% 0%,rgba(201,179,122,.16),transparent 55%),var(--s1);border:1px solid rgba(201,179,122,.28)}
.asis textarea{min-height:84px;background:rgba(0,0,0,.25)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:.6rem 0}
.chips button{border:1px solid var(--line);background:var(--s2);color:var(--mut);border-radius:999px;padding:.3rem .75rem;font-size:.82rem;cursor:pointer;text-align:left}
.chips button:hover{color:var(--tx)}
.prop{display:grid;gap:8px;margin-top:.6rem}
.acc{background:var(--s2);border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:grid;grid-template-columns:auto 1fr;gap:6px 10px;align-items:start}
.acc.off{opacity:.45}
.acc .campos{display:grid;gap:6px;min-width:0}
.acc .row>*{flex:1 1 140px}
.acc input:not([type=checkbox]),.acc select{min-height:38px;padding:.35rem .6rem;font-size:.92rem}
.acc .pill{white-space:normal}
.tipo-t{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--gold)}
.mic[aria-pressed=true]{background:var(--bad);color:#111;border-color:var(--bad)}

/* métricas */
svg.chart{width:100%;height:auto;display:block;max-height:280px}
svg.chart text{fill:var(--mut);font:12px Jost,sans-serif}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{text-align:left;padding:.5rem;border-bottom:1px solid var(--line);vertical-align:top}
thead th{font-size:.72rem;color:var(--mut);text-transform:uppercase;letter-spacing:.06em;font-weight:500}
tbody th{font-weight:500;text-transform:capitalize}
.num{text-align:right;font-variant-numeric:tabular-nums}
.up{color:var(--ok)}.down{color:var(--bad)}

/* hoja (dialog) */
dialog{background:var(--s1);color:var(--tx);border:1px solid var(--line);border-radius:22px;padding:0;width:min(620px,calc(100vw - 32px));max-height:calc(100dvh - 40px)}
dialog::backdrop{background:rgba(0,0,0,.65);backdrop-filter:blur(3px)}
.sh-h{display:flex;justify-content:space-between;align-items:center;gap:1rem;padding:16px 18px 6px;position:sticky;top:0;background:var(--s1);z-index:1}
.sh-h h2{margin:0;font-size:1.15rem;font-weight:600}
.sh-b{padding:6px 18px 22px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form>*{min-width:0}
.form .full,.form .chk{grid-column:1/-1}
.form-acc{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.tipos{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tipos button{display:flex;flex-direction:column;align-items:flex-start;gap:.15rem;background:var(--s2);border:1px solid var(--line);border-radius:16px;padding:14px;color:var(--tx);cursor:pointer;text-align:left;font-weight:500}
.tipos button:hover{border-color:var(--gold)}
.tipos b{font-size:1.4rem;color:var(--gold)}
.tipos small{color:var(--mut);font-weight:400}
@media(max-width:600px){
  dialog{width:100%;max-width:100%;margin:auto 0 0;border-radius:22px 22px 0 0;max-height:92dvh;padding-bottom:var(--safe)}
  .form{grid-template-columns:1fr}
}

.fila-item{display:grid;grid-template-columns:1fr 72px 110px auto;gap:6px;margin-bottom:6px;align-items:center}
@media(max-width:600px){.fila-item{grid-template-columns:1fr 58px 92px auto}}
.servs{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:8px}
.servs button{display:flex;flex-direction:column;align-items:flex-start;gap:.15rem;text-align:left;background:var(--s2);border:1px solid var(--line);border-radius:14px;padding:12px;color:var(--tx);cursor:pointer;font-weight:500}
.servs button:hover{border-color:var(--gold)}.servs .si{font-size:1.4rem}.servs small{color:var(--mut);font-size:.8rem;font-weight:400}
.score{width:84px;height:84px;border-radius:50%;background:conic-gradient(var(--c) calc(var(--p) * 1%),var(--s3) 0);display:grid;place-items:center;flex:0 0 auto}
.score span{width:66px;height:66px;border-radius:50%;background:var(--s1);display:grid;place-items:center;font-family:Anton,sans-serif;font-size:1.6rem}
ul.checks{list-style:none;margin:.2rem 0 .6rem;padding:0;display:grid;gap:7px}
ul.checks li{display:grid;gap:.1rem;padding-left:1.4rem;position:relative}
ul.checks li::before{position:absolute;left:0;top:0}ul.checks li.no::before{content:"✗";color:var(--bad)}ul.checks li.si::before{content:"✓";color:var(--ok)}
ul.checks li span{color:var(--mut);font-size:.88rem}
#print{display:none}
@media print{
  @page{margin:16mm}
  html,body{background:#fff!important;color:#111}
  body>*:not(#print){display:none!important}
  #print{display:block!important;font:11pt/1.5 Jost,system-ui,sans-serif;color:#111}
  #print h1{font-family:Anton,sans-serif;font-weight:400;font-size:24pt;margin:.2em 0 .6em;letter-spacing:.02em}
  #print table{width:100%;border-collapse:collapse}#print th,#print td{border-bottom:1px solid #ddd;padding:7px 6px;color:#111;text-transform:none;letter-spacing:0;font-size:10.5pt}
  #print thead th{color:#666;font-size:9pt}#print tfoot td{border:0}#print .pr-tot td{font-weight:700;font-size:13pt;border-top:2px solid #C9B37A}
  .pr-h{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid #C9B37A;padding-bottom:12px;margin-bottom:14px}
  .pr-notas{white-space:pre-wrap;background:#f6f3ec;padding:10px 12px;border-radius:8px;margin-top:16px}.pr-f{margin-top:34px;color:#444}
}

/* login */
.login{min-height:100dvh;display:grid;place-items:center;padding:24px 16px;background:radial-gradient(80% 60% at 50% 0%,rgba(201,179,122,.14),transparent 70%)}
.login-in{width:min(420px,100%)}
.login img{width:64px;height:64px;border-radius:18px;margin-bottom:18px}

<script>
document.addEventListener('DOMContentLoaded', () => {
'use strict';
const SB_URL = 'https://cvxmmrfuwjefdovoakqw.supabase.co';
const SB_KEY = 'sb_publishable_TWUBWwPYE04Nu9TaVGE0qw_-oLLb-pm';
const BUCKET = 'portal', MAX_MB = 25, WA = 'https://wa.me/5493757656783';
const $ = id => document.getElementById(id);
if (!window.supabase){ $('cargando').textContent = 'No se pudo cargar el portal. Revisá tu conexión y recargá.'; return; }
const sb = window.supabase.createClient(SB_URL, SB_KEY);

/* ================= utilidades (todo texto entra con textContent) ================= */
const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const ESTADOS = {idea:'Idea',produccion:'En producción',revision:'Para aprobar',programado:'Programado',publicado:'Publicado'};
const APROB = {pendiente:['Esperando OK','warn'],aprobado:['Aprobado','ok'],cambios:['Pidió cambios','bad']};
const TIPOS_SOL = {pedido:'Pedido',material:'Material',dato:'Dato',consulta:'Consulta',servicio:'Pedido de servicio'};
const SOL_EST = {nueva:['Nuevo','warn'],en_curso:['En curso','oro'],resuelta:['Resuelto','ok']};
const COLORES = ['#C9B37A','#7FD6E8','#F2A6C8','#B59CF0','#8FCB9B','#E9B872','#6FA8FF','#F08A80','#9FE0C9','#D6C1F5'];
const ICO = {
  home:'<path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/>',
  cal:'<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/>',
  check:'<rect x="3" y="3" width="18" height="18" rx="5"/><path d="M8 12l3 3 5-6"/>',
  users:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5"/><circle cx="17.5" cy="9" r="2.5"/><path d="M17 14.5c2.4.2 4 1.8 4.5 4.5"/>',
  chart:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
  send:'<path d="M21 3L10 14"/><path d="M21 3l-7 18-4-7-7-4z"/>',
  more:'<circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/>'
};
function h(tag, attrs, ...kids){
  const el = document.createElement(tag);
  for (const [k,v] of Object.entries(attrs || {})){
    if (v == null || v === false) continue;
    if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'class') el.className = v;
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const k of kids.flat(3)) if (k != null && k !== false) el.append(k instanceof Node ? k : String(k));
  return el;
}
function ic(n){ const s = document.createElementNS('http://www.w3.org/2000/svg','svg'); s.setAttribute('viewBox','0 0 24 24'); s.setAttribute('class','i'); s.setAttribute('aria-hidden','true'); s.innerHTML = ICO[n]; return s; }
const fill = (el, ...k) => { el.replaceChildren(...k.flat(3).filter(x => x != null && x !== false)); return el; };
const vacio = t => h('p',{class:'vacio'}, t);
const pill = (t, cls, color) => h('span',{class:'pill ' + (cls || ''), style: color ? `--c:${color}` : null}, color ? h('span',{class:'d','aria-hidden':'true'}) : null, t);
const num = n => n == null ? '—' : Number(n).toLocaleString('es-AR');
const pesos = n => n == null ? '—' : Number(n).toLocaleString('es-AR',{style:'currency',currency:'ARS',maximumFractionDigits:0});
const dLocal = s => { if (!s) return null; const [y,m,d] = String(s).slice(0,10).split('-').map(Number); return new Date(y, m-1, d); };
const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const masDias = n => { const d = new Date(); d.setDate(d.getDate() + n); return iso(d); };
const hoyISO = () => iso(new Date());
const fCorta = s => { const d = s && (String(s).length > 10 ? new Date(s) : dLocal(s)); return d ? d.toLocaleDateString('es-AR',{day:'numeric',month:'short'}) : ''; };
const fLarga = s => dLocal(s).toLocaleDateString('es-AR',{weekday:'long',day:'numeric',month:'long'});
const fRel = s => !s ? null : s === hoyISO() ? 'Hoy' : s === masDias(1) ? 'Mañana' : s === masDias(-1) ? 'Ayer' : fCorta(s);
const httpUrl = u => { try { const x = new URL(u); return /^https?:$/.test(x.protocol) ? x.href : null; } catch { return null; } };
const limpio = n => n.normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^\w.-]+/g,'-').replace(/^-+/,'').slice(-80) || 'archivo';
const hhmm = t => t ? String(t).slice(0,5) : '';
const enMes = (s, y, m) => s && String(s).startsWith(`${y}-${String(m+1).padStart(2,'0')}`);
const aviso = m => Object.assign(new Error(m), { propio:true });
let toastT;
function toast(msg, bad){ const t = $('toast'); t.textContent = msg; t.className = bad ? 'bad' : ''; clearTimeout(toastT); toastT = setTimeout(() => t.textContent = '', 4500); }
function err(e){ if (!e?.propio) console.error(e); toast(e?.propio ? e.message : 'Algo falló' + (e?.message ? `: ${e.message}` : '. Probá de nuevo.'), true); }
async function q(p){ const {data, error} = await p; if (error) throw error; return data; }
async function ocupado(btn, fn){ if (btn) btn.disabled = true; try { await fn(); } catch(e){ err(e); } finally { if (btn) btn.disabled = false; } }

/* ================= hoja (bottom sheet) ================= */
const sheet = $('sheet');
function abrirHoja(titulo, ...cuerpo){ $('sh-t').textContent = titulo; fill($('sh-b'), cuerpo); if (!sheet.open) sheet.showModal(); $('sh-b').scrollTop = 0; }
const cerrarHoja = () => { if (sheet.open) sheet.close(); };
$('sh-x').addEventListener('click', cerrarHoja);
sheet.addEventListener('click', e => { if (e.target === sheet) cerrarHoja(); });

/* ================= estado + login ================= */
const S = { user:null, equipo:false, modo:'cliente', yo:null, E:null, C:null, cid:null, misClientes:[], mes:new Date(), filtroCli:'', soloMias:true, red:null, instalar:null };

const DOMINIO = 'clientes.agencia-origen.online';
$('f-clave').addEventListener('submit', async e => {
  e.preventDefault();
  const f = e.target, msg = $('login-msg'), u = f.usuario.value.trim().toLowerCase(), c = f.clave.value;
  if (!u || !c){ for (const i of [f.usuario, f.clave]) i.toggleAttribute('aria-invalid', !i.value.trim()); msg.textContent = 'Escribí tu usuario y tu clave.'; return; }
  f.usuario.removeAttribute('aria-invalid'); f.clave.removeAttribute('aria-invalid');
  e.submitter.disabled = true; msg.textContent = 'Entrando…';
  const { error } = await sb.auth.signInWithPassword({ email: u.includes('@') ? u : `${u}@${DOMINIO}`, password: c });
  e.submitter.disabled = false;
  msg.textContent = !error ? '' : /rate|too many|seconds/i.test(error.message) ? 'Demasiados intentos. Esperá un minuto y probá de nuevo.' : 'Usuario o clave incorrectos.';
  if (error) f.clave.select();
});
// Solo equipo: entrar con un enlace al email
$('f-login').addEventListener('submit', async e => {
  e.preventDefault();
  const inp = $('email'), msg = $('login-msg'), btn = e.submitter, email = inp.value.trim().toLowerCase();
  if (!inp.checkValidity() || !email){ inp.setAttribute('aria-invalid','true'); msg.textContent = 'Escribí un email válido.'; inp.focus(); return; }
  inp.removeAttribute('aria-invalid'); btn.disabled = true; msg.textContent = 'Enviando…';
  const { error } = await sb.auth.signInWithOtp({ email, options:{ emailRedirectTo: location.origin + location.pathname } });
  btn.disabled = false;
  msg.textContent = !error ? 'Listo. Revisá tu email (y spam) y tocá el enlace.'
    : /not authorized|no autorizado|database error|not allowed/i.test(error.message) ? 'Ese email no tiene acceso.'
    : /rate|seconds/i.test(error.message) ? 'Esperá un minuto antes de pedir otro enlace.' : 'No pudimos enviar el enlace. Probá de nuevo.';
});
async function salir(){ await sb.auth.signOut(); location.replace(location.pathname); }
$('salir').addEventListener('click', salir);

let arrancado = null;
sb.auth.onAuthStateChange((ev, session) => {
  if (session?.user && arrancado !== session.user.id){ arrancado = session.user.id; setTimeout(() => entrar(session.user)); }
  if (!session){ arrancado = null; pantalla('login'); }
});
function pantalla(id){ for (const s of ['login','shell','cargando']) $(s).hidden = s !== id; }

async function entrar(user){
  S.user = user;
  if (location.hash.includes('access_token')) history.replaceState(null, '', location.pathname);
  const nom = (user.email || '?').replace('@' + DOMINIO, '');
  $('who').textContent = nom;
  $('cuenta').textContent = nom[0].toUpperCase();
  try {
    S.equipo = (await q(sb.rpc('es_equipo'))) === true;
    if (S.equipo){ S.modo = 'equipo'; await cargarEquipo(); }
    else {
      const acc = await q(sb.from('cliente_accesos').select('cliente_id'));
      const fichas = await Promise.all(acc.map(a => q(sb.rpc('mi_ficha',{p_cliente:a.cliente_id}))));
      S.misClientes = fichas.filter(Boolean).map(f => ({id:String(f.id), nombre:f.negocio || 'Mi negocio'}));
      if (!S.misClientes.length){
        pantalla('shell'); titulo('Casi listo'); fill($('nav'));
        fill($('view'), h('div',{class:'card'}, h('p',{}, 'Tu email todavía no tiene un negocio asignado. ', h('a',{href:WA,rel:'noopener'}, 'Avisanos por WhatsApp'), ' y lo activamos.')));
        return;
      }
      let g = null; try { g = localStorage.getItem('portal_cid'); } catch {}
      S.cid = S.misClientes.some(c => c.id === g) ? g : S.misClientes[0].id;
      await cargarCliente(S.cid);
    }
    pantalla('shell'); render();
  } catch(e){ err(e); pantalla('login'); }
}

/* ================= navegación ================= */
const RUTAS_E = [['hoy','Hoy','home'],['calendario','Calendario','cal'],['tareas','Tareas','check'],['clientes','Clientes','users']];
const RUTAS_C = [['inicio','Inicio','home'],['calendario','Calendario','cal'],['metricas','Métricas','chart'],['pedir','Pedir','send'],['mas','Más','more']];
const rutas = () => S.modo === 'equipo' ? RUTAS_E : RUTAS_C;
function ruta(){ const [v, arg] = location.hash.replace(/^#\/?/,'').split('/'); return { v: rutas().some(r => r[0] === v) ? v : rutas()[0][0], arg }; }
window.addEventListener('hashchange', () => { if (!$('shell').hidden) render(); });
const VE = {}, VC = {};

function render(){
  const { v, arg } = ruta();
  fill($('nav'), rutas().map(([k,t,i]) => h('a',{href:`#/${k}`, 'aria-current': k === v ? 'page' : null}, ic(i), h('span',{}, t))));
  $('nav').classList.toggle('con-fab', S.modo === 'equipo');
  $('fab').hidden = S.modo !== 'equipo';
  const viendo = S.equipo && S.modo === 'cliente';
  $('banner').hidden = !viendo;
  if (viendo) fill($('banner'), h('span',{}, 'Estás viendo el portal como lo ve ', h('b',{}, S.C?.ficha?.negocio || 'el cliente')), h('button',{type:'button',class:'btn sm',onclick:volverEquipo}, 'Volver al equipo'));
  fill($('top-extra')); fill($('view'));
  (S.modo === 'equipo' ? VE : VC)[v](arg);
}
window.addEventListener('hashchange', () => window.scrollTo(0, 0));
function titulo(t, k){ $('titulo').textContent = t; $('kicker').textContent = k || ''; document.title = `${t} · ORIGEN`; }
async function verComoCliente(id, destino = 'inicio'){ await ocupado(null, async () => { S.cid = id; await cargarCliente(id); S.modo = 'cliente'; S.mes = new Date(); S.red = null; location.hash = '#/' + destino; render(); }); }
function volverEquipo(){ S.modo = 'equipo'; location.hash = `#/clientes/${S.cid}`; render(); }
$('fab').addEventListener('click', () => abrirAsistente());
function cambiarClave(){
  const f = h('form',{novalidate:true},
    h('label',{}, 'Clave nueva (mínimo 8 caracteres)', h('input',{type:'password',name:'c1',autocomplete:'new-password',required:true,minlength:'8',maxlength:'72'})),
    h('label',{style:'margin-top:10px'}, 'Repetila', h('input',{type:'password',name:'c2',autocomplete:'new-password',required:true,maxlength:'72'})),
    h('button',{class:'btn',type:'submit',style:'width:100%;margin-top:14px'}, 'Guardar clave nueva'));
  f.addEventListener('submit', e => { e.preventDefault();
    if (f.c1.value.length < 8){ f.c1.setAttribute('aria-invalid','true'); return toast('La clave tiene que tener al menos 8 caracteres.', true); }
    if (f.c1.value !== f.c2.value){ f.c2.setAttribute('aria-invalid','true'); return toast('Las dos claves no coinciden.', true); }
    ocupado(e.submitter, async () => { const { error } = await sb.auth.updateUser({ password:f.c1.value }); if (error) throw aviso('No se pudo cambiar la clave. Probá con otra.'); cerrarHoja(); toast('Clave cambiada.'); }); });
  abrirHoja('Cambiar mi clave', f);
}
$('cuenta').addEventListener('click', () => abrirHoja('Mi cuenta',
  h('p',{class:'mut',style:'margin-top:0'}, S.user?.email?.replace('@' + DOMINIO, '')),
  S.instalar ? h('button',{type:'button',class:'btn',style:'width:100%;margin-bottom:10px',onclick:instalarApp}, 'Instalar la app') : ayudaIOS(),
  h('button',{type:'button',class:'btn ol',style:'width:100%;margin-bottom:10px',onclick:cambiarClave}, 'Cambiar mi clave'),
  h('button',{type:'button',class:'btn ol',style:'width:100%',onclick:salir}, 'Salir')));
$('clave-lado').addEventListener('click', cambiarClave);

/* instalar como app */
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); S.instalar = e; $('instalar').hidden = false; if (!$('shell').hidden && document.activeElement === document.body) render(); });
window.addEventListener('appinstalled', () => { S.instalar = null; $('instalar').hidden = true; toast('¡App instalada! Ya la tenés en tu pantalla de inicio.'); });
async function instalarApp(){ if (!S.instalar) return; S.instalar.prompt(); await S.instalar.userChoice; S.instalar = null; $('instalar').hidden = true; cerrarHoja(); }
$('instalar').addEventListener('click', instalarApp);
function ayudaIOS(){
  const ios = /iphone|ipad|ipod/i.test(navigator.userAgent), app = matchMedia('(display-mode: standalone)').matches || navigator.standalone;

function campo(f, val){
  if (f.t === 'check'){ const el = h('input',{type:'checkbox', name:f.k}); el.checked = !!val; return h('label',{class:'chk'}, el, f.l); }
  let el;
  if (f.t === 'textarea') el = h('textarea',{name:f.k, maxlength:f.max, required:!!f.req});
  else if (f.t === 'select'){ const ops = (typeof f.op === 'function' ? f.op() : f.op).slice(); if (val != null && val !== '' && !ops.some(o => o[0] === String(val))) ops.push([String(val), String(val)]);
    el = h('select',{name:f.k, required:!!f.req}, ops.map(([v,t]) => h('option',{value:v}, t))); }
  else if (f.t === 'list'){ el = h('input',{name:f.k, maxlength:f.max, list:`dl-${f.k}`, autocomplete:'off'}); el.value = val ?? ''; return h('label',{class:f.full ? 'full' : null}, f.l, el, h('datalist',{id:`dl-${f.k}`}, f.op.map(o => h('option',{value:o})))); }
  else el = h('input',{type:f.t || 'text', name:f.k, maxlength:f.max, min:f.min, required:!!f.req, inputmode: f.t === 'number' ? 'numeric' : null, max:f.maxv, placeholder: f.t === 'url' ? 'https://' : null});
  if (val != null) el.value = f.t === 'time' ? hhmm(val) : String(val);
  return h('label',{class:f.full ? 'full' : null}, f.l + (f.req ? ' *' : ''), el);
}
function valores(form, campos){
  const v = {};
  for (const f of campos){
    const el = form.elements[f.k];
    if (f.t === 'check') v[f.k] = el.checked;
    else if (f.t === 'number') v[f.k] = el.value === '' ? null : Math.round(+el.value);
    else v[f.k] = el.value.trim() || null;
  }
  return v;
}
function validar(form){
  for (const el of form.elements){
    if (!el.willValidate) continue;
    if (!el.checkValidity()){ el.setAttribute('aria-invalid','true'); el.focus(); toast(el.validationMessage || 'Revisá los datos.', true); return false; }
    el.removeAttribute('aria-invalid');
  }
  return true;
}

function editar(tipo, obj, preset){
  const F = FORMS[tipo], nuevo = !obj?.id;
  const base = nuevo ? { ...F.nuevo(), ...(preset || {}) } : (F.cargar ? F.cargar(obj) : obj);
  const form = h('form',{class:'form', novalidate:true}, F.campos.map(f => campo(f, base[f.k])));
  F.armar?.(form, base);
  const guardar = async (btn, extra) => {
    if (!validar(form)) return;
    await ocupado(btn, async () => {
      const v = { ...valores(form, F.campos), ...(extra || {}) };
      F.antes?.(v, nuevo);
      if (nuevo) await q(sb.from(F.tabla).insert(v));
      else await q(sb.from(F.tabla).update(v).eq('id', obj.id));
      cerrarHoja(); toast(extra ? 'Enviado al cliente para aprobar.' : nuevo ? F.okT : 'Cambios guardados.');
      await recargar();
    });
  };
  form.addEventListener('submit', e => { e.preventDefault(); guardar(e.submitter); });
  form.append(h('div',{class:'form-acc full'},
    h('button',{class:'btn',type:'submit'}, nuevo ? 'Agregar' : 'Guardar'),
    tipo === 'contenido' && obj?.aprobacion !== 'aprobado' ? h('button',{class:'btn ol',type:'button',onclick:e => guardar(e.currentTarget, { estado:'revision', visible_cliente:true, aprobacion:'pendiente' })}, 'Mandar al cliente para aprobar') : null,
    !nuevo && !F.sinBorrar ? h('button',{class:'btn peligro',type:'button',style:'margin-left:auto',onclick:async e => {
      if (!confirm(`¿Borrar “${obj.titulo || F.nombre}”? No se puede deshacer.`)) return;
      await ocupado(e.currentTarget, async () => { await q(sb.from(F.tabla).delete().eq('id', obj.id)); cerrarHoja(); toast('Borrado.'); await recargar(); });
    }}, 'Borrar') : null));
  abrirHoja(nuevo ? F.nuevoT : F.nombre,
    tipo === 'contenido' && obj?.id ? h('p',{class:'mut',style:'margin:0 0 .6rem'}, 'Respuesta del cliente: ', pill(...(APROB[obj.aprobacion] || ['—']))) : null,
    tipo === 'contenido' && obj?.comentario_cliente ? h('p',{class:'pre'}, '💬 ', obj.comentario_cliente) : null,
    form);
}

function cobrosDelMes(y, mm){
  const hoy = new Date(), actual = y === hoy.getFullYear() && mm === hoy.getMonth(), pasado = new Date(y, mm + 1, 0) < hoy;
  return S.E.clientes.filter(c => !c.pausado && !c.prospecto && c.abono > 0).map(c => {
    const pagado = S.E.pagos.filter(p => String(p.cliente_id) === c.id && enMes(p.fecha, y, mm)).reduce((s,p) => s + Number(p.monto || 0), 0);
    const dia = Number(c.raw.dia_cobro) || null, falta = Math.max(0, c.abono - pagado);
    return { c, pagado, falta, dia, vencido: falta > 0 && (pasado || (actual && dia && hoy.getDate() > dia)) };
  });

// Grilla del mes. En el celular: puntitos por día y, abajo, el detalle del día tocado.
function grillaMes(y, m, porDia, conAgregar){
  const off = (new Date(y, m, 1).getDay() + 6) % 7, hoy = hoyISO();
  if (!S.diaSel || !enMes(S.diaSel, y, m)) S.diaSel = enMes(hoy, y, m) ? hoy : iso(new Date(y, m, 1));
  const celdas = ['lun','mar','mié','jue','vie','sáb','dom'].map(d => h('div',{class:'dw','aria-hidden':'true'}, d));
  for (let i = 0; i < 42; i++){
    const d = new Date(y, m, 1 - off + i), k = iso(d), it = porDia[k] || [], sel = k === S.diaSel;
    if (i >= 35 && d.getMonth() !== m) break;
    const elegir = () => { S.diaSel = k; if (d.getMonth() !== m) S.mes = new Date(d.getFullYear(), d.getMonth(), 1); render(); };
    celdas.push(h('div',{class:'day' + (d.getMonth() !== m ? ' out' : '') + (k === hoy ? ' today' : '') + (sel ? ' sel' : ''), onclick:e => { if (movil() && !e.target.closest('button')) elegir(); }},
      h('div',{class:'day-h'},
        h('button',{type:'button',class:'dnum','aria-pressed':String(sel),'aria-label':`${fLarga(k)}${it.length ? ` · ${it.length} ${it.length === 1 ? 'cosa' : 'cosas'}` : ''}`,onclick:elegir}, d.getDate()),
        conAgregar ? h('button',{type:'button',class:'add','aria-label':`Agregar el ${d.getDate()} de ${MESES[d.getMonth()]}`,onclick:() => nuevoAlgo({ fecha:k })}, '+') : null),
      it.map(x => x.chip),
      it.length ? h('div',{class:'dots','aria-hidden':'true'}, it.slice(0, 4).map(x => h('i',{style:`--c:${x.color}`})), it.length > 4 ? h('b',{}, '+') : null) : null));
  }
  const it = porDia[S.diaSel] || [];
  const panel = h('section',{class:'card dia-panel','aria-live':'polite'},
    h('h2',{}, fLarga(S.diaSel).replace(/^./, c => c.toUpperCase()), conAgregar ? h('button',{type:'button',class:'btn ol sm',onclick:() => nuevoAlgo({ fecha:S.diaSel })}, '+ Agregar') : null),
    it.length ? it.map(x => h(x.abrir ? 'button' : 'div',{type:x.abrir ? 'button' : null,class:'item',style:`--c:${x.color}`,onclick:x.abrir || null},
      h('span',{class:'ico','aria-hidden':'true'}, x.ico), h('span',{class:'tx'}, x.t, x.sub ? h('small',{}, x.sub) : null))) : vacio('Nada agendado este día.'));
  return [h('div',{class:'cal'}, celdas), panel];
}

function micBtn(ta){

    const t = coment.value.trim();
    if (dec === 'cambios' && !t){ coment.setAttribute('aria-invalid','true'); coment.focus(); toast('Contanos qué cambiar.', true); return; }
    await ocupado(btn, async () => {
      await q(sb.rpc('decidir_contenido',{ p_id:c.id, p_decision:dec, p_comentario:t || null }));
      c.aprobacion = dec; c.comentario_cliente = t || null; cerrarHoja();

    c.idea ? [h('h3',{style:'font-size:.9rem;margin:.6rem 0 0'}, 'Idea'), h('div',{class:'pre'}, c.idea)] : null,
    c.copy ? [h('h3',{style:'font-size:.9rem;margin:.6rem 0 0'}, 'Texto de la publicación'), h('div',{class:'pre'}, c.copy)] : null,
    links.length ? h('p',{}, links.map((u,i) => h('a',{class:'btn ol sm',href:u,target:'_blank',rel:'noopener',style:'margin:0 6px 6px 0'}, `Ver la pieza${links.length > 1 ? ' ' + (i+1) : ''}`))) : null,
    c.comentario_cliente ? h('p',{}, h('b',{}, 'Tu comentario: '), c.comentario_cliente) : null,
    puede ? [h('label',{for:'v-com',style:'margin-top:.4rem'}, '¿Algún comentario? (opcional para aprobar)'), coment,
      h('div',{class:'row',style:'margin-top:12px'},
        h('button',{type:'button',class:'btn',onclick:e => decidir(e.currentTarget,'aprobado')}, '✓ Aprobar'),
        h('button',{type:'button',class:'btn ol',onclick:e => decidir(e.currentTarget,'cambios')}, 'Pedir cambios'))]
      : S.equipo ? h('p',{class:'mut'}, 'Vista del equipo: el cliente aprueba desde su cuenta.') : null);
}

VC.metricas = () => {
  titulo('Métricas', 'Cómo le va a tu marca'); selectorNegocio();
  const C = S.C, redes = [...new Set(C.met.map(x => x.red))];
  if (!S.red || !redes.includes(S.red)) S.red = redes[0];
  const rows = C.met.filter(x => x.red === S.red).slice(-12);
  if (!rows.length){ fill($('view'), h('div',{class:'card'}, vacio('Las métricas aparecen acá apenas cerramos el primer mes.'))); return; }
  const u = rows.at(-1), p = rows.at(-2);
  const kp = (k, t) => { const d = p && u[k] != null && p[k] ? Math.round((u[k] - p[k]) / p[k] * 100) : null;
    return h('div',{class:'stat'}, h('b',{}, num(u[k])), h('span',{}, t), d != null ? h('span',{class:d >= 0 ? 'up' : 'down',style:'display:block;font-size:.82rem'}, `${d >= 0 ? '▲' : '▼'} ${Math.abs(d)}% vs. mes anterior`) : null); };
  const W = 640, H = 220, pad = 26, max = Math.max(1, ...rows.map(r => r.visualizaciones || 0)), bw = (W - pad * 2) / Math.max(rows.length, 6);
  const NS = 'http://www.w3.org/2000/svg', s = (t, a, tx) => { const e = document.createElementNS(NS, t); for (const k in a) e.setAttribute(k, a[k]); if (tx != null) e.textContent = tx; return e; };
  const svg = s('svg',{viewBox:`0 0 ${W} ${H}`,class:'chart',role:'img','aria-label':'Visualizaciones por mes: ' + rows.map(r => `${MESES[r.mes-1]} ${num(r.visualizaciones)}`).join(', ')});
  const def = s('defs',{}), gr = s('linearGradient',{id:'gbar',x1:0,y1:0,x2:0,y2:1}); gr.append(s('stop',{offset:'0','stop-color':'#E2CC92'}), s('stop',{offset:'1','stop-color':'#8a7849'})); def.append(gr); svg.append(def);
  rows.forEach((r, i) => { const v = r.visualizaciones || 0, bh = (H - pad * 2) * v / max, x = pad + i * bw + bw * .18, yb = H - pad - bh;
    svg.append(s('rect',{x, y:yb, width:bw * .64, height:Math.max(bh, 2), rx:6, fill: i === rows.length - 1 ? 'url(#gbar)' : 'rgba(255,255,255,.16)'}),
      s('text',{x:x + bw * .32, y:H - 6, 'text-anchor':'middle'}, MESES[r.mes-1].slice(0,3)),
      s('text',{x:x + bw * .32, y:yb - 6, 'text-anchor':'middle'}, v >= 1000 ? Math.round(v / 1000) + 'k' : v)); });
  const sel = redes.length > 1 ? h('div',{class:'seg',role:'group','aria-label':'Red'}, redes.map(r => h('button',{type:'button','aria-pressed':String(r === S.red),onclick:() => { S.red = r; render(); }}, r[0].toUpperCase() + r.slice(1)))) : null;
  const mejor = httpUrl(u.mejor_post_url);
  const cols = [['seguidores','Seguidores'],['visualizaciones','Vistas'],['alcance','Alcance'],['interacciones','Interacc.'],['visitas_perfil','Visitas perfil'],['clics_enlace','Clics']];
  fill($('view'), sel ? h('div',{style:'margin-bottom:12px'}, sel) : null,
    h('div',{class:'stats'}, kp('visualizaciones','Visualizaciones'), kp('alcance','Cuentas alcanzadas'), kp('interacciones','Interacciones'), kp('seguidores','Seguidores')),
    (u.notas || mejor) ? h('section',{class:'card asis'}, h('h2',{}, `Comentario de ORIGEN · ${MESES[u.mes-1]}`), u.notas ? h('p',{style:'margin:0 0 .5rem'}, u.notas) : null,
      mejor ? h('a',{href:mejor,target:'_blank',rel:'noopener'}, `Ver el mejor post${u.mejor_post_vistas ? ` (${num(u.mejor_post_vistas)} vistas)` : ''} →`) : null) : null,
    h('section',{class:'card'}, h('h2',{}, 'Visualizaciones por mes'), svg),
    h('section',{class:'card tbl'}, h('h2',{}, 'Detalle'), h('table',{}, h('thead',{}, h('tr',{}, h('th',{scope:'col'}, 'Mes'), cols.map(([,t]) => h('th',{scope:'col',class:'num'}, t)))),
      h('tbody',{}, [...rows].reverse().map(r => h('tr',{}, h('th',{scope:'row'}, `${MESES[r.mes-1]} ${r.anio}`), cols.map(([k]) => h('td',{class:'num'}, num(r[k])))))))));
};

async function abrirArchivo(path, btn){
  const w = window.open('', '_blank'); if (w) w.opener = null;
  await ocupado(btn, async () => {
    try { const { signedUrl } = await q(sb.storage.from(BUCKET).createSignedUrl(path, 120)); if (w) w.location.href = signedUrl; else location.href = signedUrl; }
    catch(e){ w?.close(); throw e; }
  });
}
function archivosDe(s){ return (Array.isArray(s.archivos) ? s.archivos : []).filter(a => a?.path).map(a => h('button',{type:'button',class:'btn ol sm',style:'margin:4px 6px 0 0',onclick:e => abrirArchivo(a.path, e.currentTarget)}, '📎 ' + (a.nombre || 'archivo'))); }

VC.pedir = () => {
  titulo('Pedir', 'Servicios, material, datos o consultas'); selectorNegocio();
  const f = h('form',{novalidate:true},
    h('label',{}, '¿Qué nos mandás?', h('select',{name:'tipo'}, [['pedido','Un pedido (post, historia, cambio)'],['material','Material (fotos, videos, logo)'],['dato','Un dato (promo, horario, precio)'],['consulta','Una consulta']].map(([v,t]) => h('option',{value:v}, t)))),
    h('label',{style:'margin-top:10px'}, 'Mensaje *', h('textarea',{name:'mensaje',required:true,maxlength:'2000','aria-describedby':'env-cnt'})),
    h('p',{id:'env-cnt',class:'mut',style:'font-size:.8rem;text-align:right;margin:.2rem 0'}, '0 / 2000'),
    h('label',{}, 'Archivos (opcional · hasta 5, máx. 25 MB c/u)', h('input',{type:'file',name:'archivos',multiple:true,accept:'image/*,video/*,application/pdf,.zip'})),
    h('button',{class:'btn',type:'submit',style:'margin-top:14px;width:100%'}, 'Enviar a ORIGEN'));
  f.mensaje.addEventListener('input', () => $('env-cnt').textContent = `${f.mensaje.value.length} / 2000`);
  f.addEventListener('submit', async e => {
    e.preventDefault();
    const msj = f.mensaje.value.trim(), files = [...f.archivos.files];
    if (!msj){ f.mensaje.setAttribute('aria-invalid','true'); f.mensaje.focus(); return toast('Escribí un mensaje.', true); }
    f.mensaje.removeAttribute('aria-invalid');
    if (files.length > 5) return toast('Máximo 5 archivos por envío.', true);
    const g = files.find(x => x.size > MAX_MB * 1048576); if (g) return toast(`“${g.name}” pesa más de ${MAX_MB} MB.`, true);
    await ocupado(e.submitter, async () => {
      const paths = [];
      for (const x of files){ const path = `${S.cid}/material/${Date.now()}-${limpio(x.name)}`; await q(sb.storage.from(BUCKET).upload(path, x, { contentType:x.type || 'application/octet-stream' })); paths.push({ path, nombre:x.name.slice(0,120) }); }
      await q(sb.from('solicitudes').insert({ cliente_id:S.cid, tipo:f.tipo.value, mensaje:msj, archivos:paths }));
      toast('¡Recibido! Te respondemos por acá.'); await refrescarSol();
    });
  });
  fill($('view'),
    h('section',{class:'card asis'}, h('h2',{}, 'Sumá más a tu marca', h('small',{}, 'tocá y te armamos un presupuesto')),
      h('div',{class:'servs'}, SERVICIOS.map(s => h('button',{type:'button',onclick:() => pedirServicio(s)}, h('span',{class:'si','aria-hidden':'true'}, s[0]), h('b',{}, s[1]), h('small',{}, s[2]))))),
    h('div',{class:'grid g2'}, h('section',{class:'card'}, h('h2',{}, 'Mandanos algo'), f),
      h('section',{class:'card'}, h('h2',{}, 'Lo que nos pediste'), S.C.sol.length ? S.C.sol.map(s => h('div',{class:'li'},
        h('div',{class:'row',style:'justify-content:space-between;align-items:center'}, h('b',{}, s.servicio || TIPOS_SOL[s.tipo]), pill(...SOL_EST[s.estado])),
        h('div',{class:'mut',style:'font-size:.82rem'}, fCorta(s.creado_en)), h('div',{class:'pre'}, s.mensaje), archivosDe(s),
        s.respuesta ? h('p',{style:'margin:.4rem 0 0'}, h('b',{}, 'ORIGEN: '), s.respuesta) : null)) : vacio('Todavía no nos pediste nada.'))));
};
async function refrescarSol(){ S.C.sol = await q(sb.from('solicitudes').select('*').eq('cliente_id',S.cid).order('creado_en',{ascending:false}).limit(30)); render(); }
function pedirServicio(s, pre){
  if (S.equipo) return toast('Vista del equipo: el cliente lo pide desde su cuenta.', true);
  const f = h('form',{novalidate:true},
    h('p',{class:'mut',style:'margin-top:0'}, s[2]),
    h('label',{}, 'Contanos qué necesitás *', h('textarea',{name:'mensaje',required:true,maxlength:'2000',placeholder:'Ej.: fotos de los platos nuevos para la carta y redes'})),
    h('label',{style:'margin-top:10px'}, '¿Para cuándo? (opcional)', h('input',{type:'date',name:'fecha',min:hoyISO()})),
    h('button',{class:'btn',type:'submit',style:'margin-top:14px;width:100%'}, 'Pedir presupuesto'));
  if (pre) f.mensaje.value = pre;
  f.addEventListener('submit', async e => {
    e.preventDefault(); if (!validar(f)) return;
    await ocupado(e.submitter, async () => {
      await q(sb.from('solicitudes').insert({ cliente_id:S.cid, tipo:'servicio', servicio:s[1], mensaje:f.mensaje.value.trim(), fecha_preferida:f.fecha.value || null, archivos:[] }));
      cerrarHoja(); toast('¡Listo! Te armamos el presupuesto y te avisamos.'); await refrescarSol();
    });
  });
  abrirHoja(`${s[0]} ${s[1]}`, f);
}
function verPresupuesto(p){
  const sub = (p.items || []).reduce((s,i) => s + i.cant * i.precio, 0), nombre = S.C.ficha?.negocio;
  const responder = async (btn, acepta) => {
    if (!acepta && !confirm('¿Rechazar este presupuesto?')) return;
    await ocupado(btn, async () => {
      await q(sb.rpc('responder_presupuesto',{ p_id:p.id, p_acepta:acepta }));
      p.estado = acepta ? 'aceptado' : 'rechazado'; cerrarHoja();
      toast(acepta ? '¡Gracias! Ya le avisamos al equipo 🙌' : 'Listo, quedó registrado.'); render();
    });
  };
  abrirHoja(p.titulo,
    h('p',{class:'mut',style:'margin-top:0'}, fCorta(p.creado_en), p.validez ? ` · válido hasta el ${fCorta(p.validez)}` : '', ' ', pill(...PRE_EST[p.estado])),
    h('div',{class:'tbl'}, h('table',{}, h('thead',{}, h('tr',{}, h('th',{scope:'col'}, 'Detalle'), h('th',{scope:'col',class:'num'}, 'Cant.'), h('th',{scope:'col',class:'num'}, 'Subtotal'))),
      h('tbody',{}, (p.items || []).map(i => h('tr',{}, h('td',{}, i.desc), h('td',{class:'num'}, i.cant), h('td',{class:'num'}, pesos(i.cant * i.precio))))))),
    p.descuento ? h('p',{class:'mut',style:'text-align:right;margin:.5rem 0 0'}, `Subtotal ${pesos(sub)} · descuento ${p.descuento}%`) : null,
    h('p',{style:'text-align:right;font-size:1.3rem;margin:.4rem 0'}, 'Total ', h('b',{}, pesos(p.total))),
    p.notas ? h('div',{class:'pre'}, p.notas) : null,
    h('div',{class:'row',style:'margin-top:12px'},
      p.estado === 'enviado' && !S.equipo ? [h('button',{type:'button',class:'btn',onclick:e => responder(e.currentTarget, true)}, '✓ Acepto'), h('button',{type:'button',class:'btn ol',onclick:e => responder(e.currentTarget, false)}, 'No por ahora')] : null,
      h('button',{type:'button',class:'btn ghost',onclick:() => imprimirPresupuesto(p, nombre)}, 'Descargar PDF')));
}

  if (!d) return null;

  const sn = v => v === true ? pill('Sí','ok') : v === false ? pill('No','bad') : pill('—');
  return h('section',{class:'card'}, h('h2',{}, 'Tu presencia digital', d.actualizado_en ? h('small',{}, `revisado el ${fCorta(d.actualizado_en)}`) : null),
    h('div',{class:'row',style:'align-items:flex-start;gap:16px'}, d.seo_puntaje != null ? anillo(d.seo_puntaje) : null,
      h('div',{style:'flex:1 1 220px;display:grid;gap:6px'},

        h('span',{}, 'Ficha de Google: ', sn(d.google_ficha), d.google_estrellas != null ? ` ${d.google_estrellas}★` : '', d.google_resenas != null ? ` · ${d.google_resenas} reseñas` : ''),
        h('span',{}, 'Te recomienda la IA (ChatGPT, Google): ', sn(d.aparece_ia)))),
    malos.length ? [h('p',{class:'grupo'}, 'Lo que podemos mejorar'), h('ul',{class:'checks'}, malos.map(x => h('li',{class:'no'}, h('b',{}, x.texto), x.consejo ? h('span',{}, x.consejo) : null)))] : null,
    d.recomendaciones ? h('div',{class:'pre'}, d.recomendaciones) : null,
    h('button',{type:'button',class:'btn',style:'margin-top:6px',onclick:() => pedirServicio(SERVICIOS[3], 'Quiero mejorar mi presencia digital según el diagnóstico.')}, 'Quiero mejorarlo'));
}

  fill($('view'),
    C.pre.length ? h('section',{class:'card'}, h('h2',{}, 'Presupuestos'), C.pre.map(p => h('button',{type:'button',class:'item',style:'--c:var(--gold)',onclick:() => verPresupuesto(p)},

        C.ficha?.mensual ? h('p',{style:'margin-top:.8rem'}, 'Abono mensual: ', h('b',{}, pesos(C.ficha.mensual)), C.ficha.dia_cobro ? ` · se cobra el día ${C.ficha.dia_cobro}` : '') : null),
      h('section',{class:'card tbl'}, h('h2',{}, 'Pagos registrados'), C.pag.length ? h('table',{}, h('thead',{}, h('tr',{}, h('th',{scope:'col'}, 'Fecha'), h('th',{scope:'col',class:'num'}, 'Monto'), h('th',{scope:'col'}, 'Detalle'))),
        h('tbody',{}, C.pag.map(p => h('tr',{}, h('td',{}, fCorta(p.fecha)), h('td',{class:'num'}, pesos(p.monto)), h('td',{}, p.nota || ''))))) : vacio('Sin pagos registrados.'))),
    h('section',{class:'card'}, h('h2',{}, 'Tu portal en el celular'),
      S.instalar ? h('button',{type:'button',class:'btn',onclick:instalarApp}, 'Instalar la app') : (ayudaIOS() || h('p',{class:'mut',style:'margin:0'}, 'En Android: menú ⋮ del navegador → “Instalar app” o “Agregar a pantalla de inicio”.')),
      h('div',{class:'row',style:'margin-top:12px'}, h('a',{class:'btn ol',href:WA,rel:'noopener'}, 'WhatsApp de ORIGEN'), h('button',{type:'button',class:'btn ghost',onclick:salir}, 'Salir'))));
