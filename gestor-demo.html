<!DOCTYPE html>
<!-- Gestor de reservas ORIGEN — v1.1 DEMO · 2026-11-10 · publicado en agencia-origen.online con link de vuelta a ORIGEN Turismo -->
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Demo del gestor de reservas · ORIGEN Turismo</title>
<link rel="icon" href="logo-origen.png">
<style>
:root{--g:#1f3a2c;--bg:#eceae2;--ink:#17231c;--mut:#566259;--line:#d9d6cc;--bad:#b3261e}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;font:400 1rem/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--g);outline-offset:2px}
header{background:var(--g);color:#fff;padding:.8rem 1rem;display:flex;flex-wrap:wrap;gap:.6rem 1.2rem;align-items:center}
header h1{font-size:1.1rem;margin:0 auto 0 0}
nav{display:flex;gap:.3rem;flex-wrap:wrap}
nav button{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.4);border-radius:999px;padding:.4rem .9rem;cursor:pointer}
nav button[aria-current=true]{background:#fff;color:var(--g);font-weight:700}
main{padding:1rem;max-width:1300px;margin:auto}
.card{background:#fff;border-radius:16px;padding:1rem;margin-bottom:1rem;overflow-x:auto}
h2{margin:.2rem 0 .8rem;font-size:1.25rem}h3{margin:.2rem 0 .5rem;font-size:1.05rem}
.btn{background:var(--g);color:#fff;border:0;border-radius:999px;padding:.55rem 1.1rem;cursor:pointer;font-weight:600}
.btn.ol{background:transparent;color:var(--g);border:1px solid #b9c3b6}
.btn[disabled]{opacity:.5;cursor:wait}
.row{display:flex;flex-wrap:wrap;gap:.6rem;align-items:end;margin-bottom:.8rem}
label{display:grid;gap:.2rem;font-size:.82rem;font-weight:600;color:var(--mut)}
input,select,textarea{border:1px solid #bdb9ab;border-radius:8px;padding:.45rem .6rem;background:#fff;min-width:0}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{text-align:left;padding:.45rem .5rem;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:.78rem;color:var(--mut);text-transform:uppercase;letter-spacing:.05em}
.cal{border-collapse:separate;border-spacing:0}
.cal th,.cal td{padding:0;text-align:center;border:0}
.cal th.u{position:sticky;left:0;background:#fff;text-align:left;padding:0 .6rem 0 0;z-index:1;font-size:.9rem;text-transform:none;letter-spacing:0;color:var(--ink)}
.cal thead th{font-size:.7rem;padding-bottom:.2rem}
.cal thead th.m{color:var(--g);font-weight:800}
.cal td button{width:30px;height:34px;border:1px solid #e6e3d9;background:#faf9f5;cursor:pointer;font-size:.72rem;font-weight:700;padding:0}
.cal td button:hover{border-color:var(--g)}
.s-directo{background:#bfe3c9!important}.s-airbnb{background:#f7c6c9!important}.s-booking{background:#bcd4f5!important}
.s-expedia{background:#f6e3a1!important}.s-otro{background:#d9d6cc!important}
.s-bloqueo{background:repeating-linear-gradient(45deg,#d9d6cc,#d9d6cc 4px,#efede5 4px,#efede5 8px)!important}
.s-pend{outline:2px dashed #7d6030;outline-offset:-3px}
.conf{outline:2px solid var(--bad)!important;outline-offset:-2px;color:var(--bad)}
.leg{display:flex;flex-wrap:wrap;gap:.4rem 1rem;font-size:.82rem;margin-top:.8rem}
.leg i{display:inline-block;width:14px;height:14px;border-radius:3px;vertical-align:-2px;margin-right:.3rem;border:1px solid #bbb}
dialog{border:0;border-radius:18px;padding:1.2rem;width:min(560px,94vw)}
dialog::backdrop{background:rgba(0,0,0,.45)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:.7rem}
.err{color:var(--bad);font-weight:600}.ok{color:#1b6b3a;font-weight:600}.mut{color:var(--mut);font-size:.88rem}
.login{max-width:380px;margin:12vh auto;display:grid;gap:.8rem}
.url{width:100%;font-size:.8rem}
@media(max-width:600px){.grid2{grid-template-columns:1fr}}
</style>
</head>
<body>
<div style="background:#7d6030;color:#fff;text-align:center;padding:.45rem 1rem;font-size:.86rem">DEMO con datos de ejemplo: probá crear una reserva que se superponga o tocá "Sincronizar canales". No se guarda nada. · <a href="turismo.html" style="color:#fff">← Volver a ORIGEN Turismo</a></div>
<div id="app"></div>
<script type="module">

/* ====== MODO DEMO: base de datos simulada en memoria (no se guarda nada) ====== */
const D=(n)=>{const d=new Date();d.setDate(d.getDate()+n);return new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)}
const T={
 profiles:[{id:'u1',email:'origen@demo.com',name:'ORIGEN',role:'admin'},{id:'u2',email:'propietario@elmanantial.com',name:'Propietario',role:'owner'}],
 properties:[{id:'p1',name:'Cabañas El Manantial de Iguazú',owner_id:'u2',commission_pct:7}],
 units:[{id:'n1',property_id:'p1',name:'Cabaña para 2',capacity:2},{id:'n2',property_id:'p1',name:'Cabaña para 4',capacity:4},{id:'n3',property_id:'p1',name:'Cabaña para 6',capacity:6}],
 channels:[],bookings:[]}
for(const u of ['n1','n2','n3']){
 T.channels.push({id:'ca'+u,unit_id:u,name:'Airbnb',ical_url:'https://www.airbnb.com/calendar/ical/123456.ics',export_token:crypto.randomUUID(),last_sync:new Date(Date.now()-36e5).toISOString(),last_status:'OK · 3 eventos'})
 T.channels.push({id:'cb'+u,unit_id:u,name:'Booking',ical_url:'https://admin.booking.com/hotel/hoteladmin/ical.html?t=abc',export_token:crypto.randomUUID(),last_sync:new Date(Date.now()-36e5).toISOString(),last_status:'OK · 2 eventos'})}
const B=(unit,ch,src,st,a,b,g,tot,dep)=>T.bookings.push({id:'b'+T.bookings.length,unit_id:unit,channel_id:ch?ch+unit:null,source:src,status:st,guest:g||null,check_in:D(a),check_out:D(b),total:tot??null,deposit:dep??null,guests:null,phone:null,notes:null})
B('n1','ca','Airbnb','confirmada',1,4,null,180000)
B('n1',null,'Directo','confirmada',6,9,'Marcos P.',210000,63000)
B('n1','cb','Booking','confirmada',12,15,null,195000)
B('n1',null,'Otro','bloqueo',20,22,'Mantenimiento')
B('n2','cb','Booking','confirmada',0,3,null,330000)
B('n2',null,'Directo','pendiente',5,8,'Familia Gómez',360000,108000)
B('n2',null,'Expedia','confirmada',10,14,'Reserva Expedia',520000)
B('n2','ca','Airbnb','confirmada',16,19,null,390000)
B('n3','ca','Airbnb','confirmada',2,6,null,640000)
B('n3','cb','Booking','confirmada',5,8,null,480000)
B('n3',null,'Directo','confirmada',14,18,'Grupo Silva',700000,210000)
const live=(b)=>['confirmada','pendiente','bloqueo'].includes(b.status)
class Q{constructor(t){this.t=t;this.f=[];this.op='select'}
 select(){return this} order(c){this.ord=c;return this} eq(c,v){this.f.push([c,v]);return this} single(){this.sg=true;return this}
 insert(r){this.op='insert';this.p=r;return this} update(r){this.op='update';this.p=r;return this} delete(){this.op='delete';return this}
 then(a,b){return Promise.resolve(this.run()).then(a,b)}
 run(){const rows=T[this.t],m=(r)=>this.f.every(([c,v])=>r[c]===v)
  if(this.op==='insert'){const r={id:crypto.randomUUID(),source:'Directo',status:'confirmada',channel_id:null,...this.p}
   if(this.t==='channels')Object.assign(r,{export_token:crypto.randomUUID(),ical_url:null})
   if(this.t==='bookings'&&!r.channel_id&&live(r)&&rows.some(o=>o.unit_id===r.unit_id&&live(o)&&o.check_in<r.check_out&&r.check_in<o.check_out))return{error:{message:'Esas fechas ya están ocupadas en esta unidad'}}
   rows.push(r);return{error:null}}
  if(this.op==='update'){rows.filter(m).forEach(r=>Object.assign(r,this.p));return{error:null}}
  if(this.op==='delete'){T[this.t]=rows.filter(r=>!m(r));return{error:null}}
  let out=structuredClone(rows.filter(m));if(this.ord)out.sort((a,b)=>String(a[this.ord]).localeCompare(String(b[this.ord])))
  return this.sg?{data:out[0],error:null}:{data:out,error:null}}}
const createClient=()=>({auth:{getSession:async()=>({data:{session:{user:{id:'u1'},access_token:'demo'}}}),signOut:async()=>{location.reload()},signInWithPassword:async()=>({error:null})},from:(t)=>new Q(t)})
const _f=window.fetch
window.fetch=async(u,o)=>{if(String(u).includes('ical-sync')){await new Promise(r=>setTimeout(r,900))
  T.bookings.push({id:'nb'+Date.now(),unit_id:'n1',channel_id:'can1',source:'Airbnb',status:'confirmada',guest:null,check_in:D(26),check_out:D(29),total:null})
  T.channels.forEach(c=>{c.last_sync=new Date().toISOString();c.last_status='OK · sincronizado ahora'})
  return new Response(JSON.stringify([{canal:'Airbnb',ok:true,eventos:4},{canal:'Booking',ok:true,eventos:3}]))}
 return _f(u,o)}
const SUPABASE_URL_DEMO='https://tu-proyecto.supabase.co'
/* ====== fin demo ====== */


/* ====== CONFIGURACIÓN: Supabase > Project Settings > API ====== */
const SUPABASE_URL = SUPABASE_URL_DEMO
const SUPABASE_ANON = 'TU_ANON_KEY'
/* =============================================================== */

const db = createClient(SUPABASE_URL, SUPABASE_ANON)
const app = document.getElementById('app')
const $ = (s, r = document) => r.querySelector(s)
const h = (t, a = {}, ...k) => {
  const e = document.createElement(t)
  for (const [x, v] of Object.entries(a)) {
    if (x.startsWith('on')) e.addEventListener(x.slice(2), v)
    else if (x === 'class') e.className = v
    else if (v !== false && v != null) e.setAttribute(x, v === true ? '' : v)
  }
  e.append(...k.flat().filter((c) => c != null && c !== false))
  return e
}
const SOURCES = ['Directo', 'Airbnb', 'Booking', 'Expedia', 'Alquiler Argentina', 'Otro']
const STATUS = { confirmada: 'Confirmada', pendiente: 'Pendiente', cancelada: 'Cancelada', bloqueo: 'Bloqueo' }
const sk = (s) => /airbnb/i.test(s) ? 'airbnb' : /booking/i.test(s) ? 'booking' : /expedia/i.test(s) ? 'expedia' : /directo/i.test(s) ? 'directo' : 'otro'
const iso = (d) => new Date(d.getTime() - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 10)
const addDays = (s, n) => { const d = new Date(s + 'T12:00'); d.setDate(d.getDate() + n); return iso(d) }
const nights = (a, b) => Math.round((new Date(b) - new Date(a)) / 864e5)
const money = (n) => n == null ? '—' : '$ ' + Number(n).toLocaleString('es-AR')
const dmy = (s) => s.split('-').reverse().join('/')
const active = (b) => b.status !== 'cancelada'

const S = { user: null, me: null, admin: false, props: [], units: [], channels: [], bookings: [], profiles: [], tab: 'cal', start: iso(new Date()), month: iso(new Date()).slice(0, 7), msg: '' }

async function load() {
  const [me, props, units, channels, bookings, profiles] = await Promise.all([
    db.from('profiles').select('*').eq('id', S.user.id).single(),
    db.from('properties').select('*').order('name'),
    db.from('units').select('*').order('name'),
    db.from('channels').select('*').order('name'),
    db.from('bookings').select('*').order('check_in'),
    db.from('profiles').select('id,email,name,role'),
  ])
  S.me = me.data; S.admin = me.data?.role === 'admin'
  S.props = props.data ?? []; S.units = units.data ?? []; S.channels = channels.data ?? []
  S.bookings = bookings.data ?? []; S.profiles = profiles.data ?? []
}

async function boot() {
  const { data: { session } } = await db.auth.getSession()
  if (!session) return renderLogin()
  S.user = session.user
  await load(); render()
}

function renderLogin(err = '') {
  const f = h('form', { class: 'card login', onsubmit: async (e) => {
    e.preventDefault()
    const { error } = await db.auth.signInWithPassword({ email: f.email.value, password: f.password.value })
    error ? renderLogin('Email o contraseña incorrectos') : boot()
  } },
    h('h2', {}, 'Gestor de reservas'),
    h('label', {}, 'Email', h('input', { name: 'email', type: 'email', required: true, autocomplete: 'username' })),
    h('label', {}, 'Contraseña', h('input', { name: 'password', type: 'password', required: true, autocomplete: 'current-password' })),
    err && h('p', { class: 'err', role: 'alert' }, err),
    h('button', { class: 'btn', type: 'submit' }, 'Ingresar'))
  app.replaceChildren(f)
}

function render() {
  const tabs = [['cal', 'Calendario'], ['res', 'Reservas'], ['liq', 'Liquidación'], ...(S.admin ? [['can', 'Canales'], ['alo', 'Alojamientos']] : [])]
  const view = { cal: vCal, res: vRes, liq: vLiq, can: vCan, alo: vAlo }[S.tab]()
  app.replaceChildren(
    h('header', {}, h('h1', {}, 'Gestor de reservas · ORIGEN'),
      h('nav', { 'aria-label': 'Secciones' }, tabs.map(([k, n]) => h('button', { 'aria-current': S.tab === k, onclick: () => { S.tab = k; S.msg = ''; render() } }, n))),
      h('button', { class: 'btn ol', style: 'color:#fff;border-color:#fff6', onclick: async () => { await db.auth.signOut(); renderLogin() } }, 'Salir')),
    h('main', {}, S.msg && h('p', { class: 'card ok', role: 'status' }, S.msg), view))
}

/* ---------- Calendario ---------- */
function vCal() {
  const days = Array.from({ length: 42 }, (_, i) => addDays(S.start, i))
  const hoy = iso(new Date())
  const rows = S.units.map((u) => {
    const bs = S.bookings.filter((b) => b.unit_id === u.id && active(b))
    const pn = S.props.find((p) => p.id === u.property_id)?.name ?? ''
    return h('tr', {}, h('th', { class: 'u', scope: 'row' }, `${pn} · ${u.name}`), days.map((d) => {
      const on = bs.filter((b) => b.check_in <= d && d < b.check_out)
      const b = on[0]
      const cls = !b ? '' : (b.status === 'bloqueo' ? 's-bloqueo' : 's-' + sk(b.source)) + (b.status === 'pendiente' ? ' s-pend' : '') + (on.length > 1 ? ' conf' : '')
      const label = b ? `${dmy(d)} ${u.name}: ${b.guest || b.source}${on.length > 1 ? ' (CONFLICTO)' : ''}` : `${dmy(d)} ${u.name}: libre`
      return h('td', {}, h('button', { class: cls, title: label, 'aria-label': label, onclick: () => S.admin ? dBooking(b ?? { unit_id: u.id, check_in: d, check_out: addDays(d, 1) }) : null },
        on.length > 1 ? '!' : b ? (b.status === 'bloqueo' ? '×' : b.source[0]) : ''))
    }))
  })
  const head = h('tr', {}, h('th', {}), days.map((d) => h('th', { class: d.endsWith('-01') ? 'm' : '', scope: 'col', style: d === hoy ? 'color:var(--g);text-decoration:underline' : '' }, d.slice(8))))
  const conflicts = S.units.flatMap((u) => {
    const bs = S.bookings.filter((b) => b.unit_id === u.id && active(b))
    return bs.flatMap((a, i) => bs.slice(i + 1).filter((b) => a.check_in < b.check_out && b.check_in < a.check_out).map((b) => `${u.name}: ${a.source} (${dmy(a.check_in)}–${dmy(a.check_out)}) se superpone con ${b.source} (${dmy(b.check_in)}–${dmy(b.check_out)})`))
  })
  return h('section', {},
    conflicts.length > 0 && h('div', { class: 'card', role: 'alert' }, h('h3', { class: 'err' }, `⚠ ${conflicts.length} conflicto(s) de doble reserva`), h('ul', {}, conflicts.map((c) => h('li', {}, c)))),
    h('div', { class: 'card' },
      h('div', { class: 'row' },
        h('label', {}, 'Desde', h('input', { type: 'date', value: S.start, onchange: (e) => { if (e.target.value) { S.start = e.target.value; render() } } })),
        h('button', { class: 'btn ol', onclick: () => { S.start = addDays(S.start, -14); render() } }, '← 2 semanas'),
        h('button', { class: 'btn ol', onclick: () => { S.start = addDays(S.start, 14); render() } }, '2 semanas →'),
        S.admin && h('button', { class: 'btn', onclick: () => dBooking({ unit_id: S.units[0]?.id, check_in: hoy, check_out: addDays(hoy, 1) }) }, '+ Nueva reserva'),
        S.admin && h('button', { class: 'btn ol', id: 'sync', onclick: sync }, 'Sincronizar canales')),
      S.units.length ? h('div', { role: 'region', 'aria-label': 'Calendario de ocupación', tabindex: 0, style: 'overflow-x:auto' }, h('table', { class: 'cal' }, h('thead', {}, head), h('tbody', {}, rows))) : h('p', { class: 'mut' }, 'Todavía no hay unidades. Cargalas en "Alojamientos".'),
      h('div', { class: 'leg' }, [['directo', 'Directo'], ['airbnb', 'Airbnb'], ['booking', 'Booking'], ['expedia', 'Expedia'], ['otro', 'Otro'], ['bloqueo', 'Bloqueo']].map(([k, n]) => h('span', {}, h('i', { class: 's-' + k }), n)), h('span', {}, '! = conflicto · borde punteado = pendiente'))))
}

async function sync() {
  const btn = $('#sync'); btn.disabled = true; btn.textContent = 'Sincronizando…'
  const { data: { session } } = await db.auth.getSession()
  try {
    const r = await fetch(SUPABASE_URL + '/functions/v1/ical-sync', { method: 'POST', headers: { Authorization: 'Bearer ' + session.access_token, apikey: SUPABASE_ANON } })
    if (!r.ok) throw new Error(await r.text())
    const res = await r.json()
    S.msg = res.length ? res.map((x) => `${x.canal}: ${x.ok ? x.eventos + ' eventos' : 'ERROR ' + x.error}`).join(' · ') : 'No hay canales con iCal cargado.'
  } catch (e) { S.msg = 'No se pudo sincronizar: ' + e.message }
  await load(); render()
}

/* ---------- Diálogo de reserva ---------- */
function dBooking(b) {
  const imp = !!b.channel_id
  const f = h('form', { method: 'dialog' })
  const fld = (l, n, a = {}) => h('label', {}, l, h('input', { name: n, value: b[n] ?? '', ...a }))
  const sel = (l, n, opts, val) => h('label', {}, l, h('select', { name: n }, opts.map(([v, t]) => h('option', { value: v, selected: v === val }, t))))
  const err = h('p', { class: 'err', role: 'alert' })
  f.append(h('h2', {}, b.id ? 'Editar reserva' : 'Nueva reserva'),
    imp && h('p', { class: 'mut' }, `Viene de ${b.source}. Las fechas y el estado los maneja el canal; acá podés completar huésped, total y notas.`),
    h('div', { class: 'grid2' },
      sel('Unidad', 'unit_id', S.units.map((u) => [u.id, `${S.props.find((p) => p.id === u.property_id)?.name} · ${u.name}`]), b.unit_id),
      sel('Origen', 'source', SOURCES.map((s) => [s, s]), b.source ?? 'Directo'),
      fld('Entrada', 'check_in', { type: 'date', required: true }), fld('Salida', 'check_out', { type: 'date', required: true }),
      sel('Estado', 'status', Object.entries(STATUS), b.status ?? 'confirmada'),
      fld('Personas', 'guests', { type: 'number', min: 1, max: 20 }),
      fld('Huésped', 'guest', { maxlength: 120 }), fld('Teléfono', 'phone', { type: 'tel', maxlength: 40 }),
      fld('Total ($)', 'total', { type: 'number', min: 0, step: '0.01' }), fld('Seña ($)', 'deposit', { type: 'number', min: 0, step: '0.01' })),
    h('label', { style: 'margin-top:.7rem' }, 'Notas', h('textarea', { name: 'notes', rows: 2, maxlength: 500 }, b.notes ?? '')),
    err,
    h('div', { class: 'row', style: 'margin:.8rem 0 0' },
      h('button', { class: 'btn', type: 'submit', value: 'ok' }, 'Guardar'),
      h('button', { class: 'btn ol', type: 'button', onclick: () => dlg.close() }, 'Cancelar'),
      b.id && h('button', { class: 'btn ol', type: 'button', style: 'margin-left:auto;color:var(--bad)', onclick: async () => {
        if (!confirm('¿Borrar esta reserva?')) return
        const { error } = await db.from('bookings').delete().eq('id', b.id)
        error ? (err.textContent = error.message) : (dlg.close(), reload())
      } }, 'Borrar')))
  if (imp) for (const n of ['unit_id', 'source', 'check_in', 'check_out', 'status']) f.elements[n].disabled = true
  const dlg = h('dialog', {}, f)
  f.addEventListener('submit', async (e) => {
    e.preventDefault()
    const v = Object.fromEntries(new FormData(f))
    const num = (x) => x === '' || x == null ? null : Number(x)
    const row = { guest: v.guest || null, phone: v.phone || null, guests: num(v.guests), total: num(v.total), deposit: num(v.deposit), notes: v.notes || null }
    if (!imp) Object.assign(row, { unit_id: v.unit_id, source: v.source, status: v.status, check_in: v.check_in, check_out: v.check_out })
    if (!imp && v.check_out <= v.check_in) return void (err.textContent = 'La salida tiene que ser después de la entrada')
    const { error } = b.id ? await db.from('bookings').update(row).eq('id', b.id) : await db.from('bookings').insert(row)
    error ? (err.textContent = error.message) : (dlg.close(), reload())
  })
  dlg.addEventListener('close', () => dlg.remove())
  document.body.append(dlg); dlg.showModal()
}
async function reload() { await load(); render() }

/* ---------- Reservas ---------- */
function vRes() {
  const hoy = iso(new Date())
  const f = { st: S.fSt ?? '', past: !!S.fPast }
  const list = S.bookings.filter((b) => (!f.st || b.status === f.st) && (f.past || b.check_out >= hoy)).sort((a, b) => a.check_in.localeCompare(b.check_in))
  return h('div', { class: 'card' }, h('h2', {}, 'Reservas'),
    h('div', { class: 'row' },
      h('label', {}, 'Estado', h('select', { onchange: (e) => { S.fSt = e.target.value; render() } }, h('option', { value: '' }, 'Todos'), Object.entries(STATUS).map(([v, t]) => h('option', { value: v, selected: v === f.st }, t)))),
      h('label', { style: 'display:flex;gap:.4rem;align-items:center' }, h('input', { type: 'checkbox', checked: f.past, onchange: (e) => { S.fPast = e.target.checked; render() } }), 'Incluir pasadas'),
      S.admin && h('button', { class: 'btn', onclick: () => dBooking({ unit_id: S.units[0]?.id, check_in: hoy, check_out: addDays(hoy, 1) }) }, '+ Nueva reserva')),
    h('table', {}, h('thead', {}, h('tr', {}, ['Entrada', 'Salida', 'Noches', 'Unidad', 'Origen', 'Huésped', 'Estado', 'Total', 'Seña', ''].map((t) => h('th', { scope: 'col' }, t)))),
      h('tbody', {}, list.map((b) => h('tr', {}, h('td', {}, dmy(b.check_in)), h('td', {}, dmy(b.check_out)), h('td', {}, nights(b.check_in, b.check_out)),
        h('td', {}, S.units.find((u) => u.id === b.unit_id)?.name ?? ''), h('td', {}, b.source), h('td', {}, b.guest || '—'), h('td', {}, STATUS[b.status]),
        h('td', {}, money(b.total)), h('td', {}, money(b.deposit)), h('td', {}, S.admin && h('button', { class: 'btn ol', onclick: () => dBooking(b) }, 'Editar')))))),
    !list.length && h('p', { class: 'mut' }, 'No hay reservas para mostrar.'))
}

/* ---------- Liquidación (comisión por propiedad) ---------- */
function vLiq() {
  const rows = S.props.map((p) => {
    const ids = S.units.filter((u) => u.property_id === p.id).map((u) => u.id)
    const bs = S.bookings.filter((b) => ids.includes(b.unit_id) && b.status === 'confirmada' && b.check_in.startsWith(S.month))
    const total = bs.reduce((a, b) => a + (Number(b.total) || 0), 0)
    const com = total * p.commission_pct / 100
    const owner = S.profiles.find((x) => x.id === p.owner_id)
    return h('tr', {}, h('td', {}, p.name), h('td', {}, owner?.email ?? '—'), h('td', {}, bs.length), h('td', {}, money(total)), h('td', {}, p.commission_pct + '%'), h('td', {}, money(Math.round(com))), h('td', {}, money(Math.round(total - com))))
  })
  return h('div', { class: 'card' }, h('h2', {}, 'Liquidación mensual'),
    h('p', { class: 'mut' }, 'Suma las reservas confirmadas cuya entrada cae en el mes (con "Total" cargado) y calcula la comisión.'),
    h('div', { class: 'row' }, h('label', {}, 'Mes', h('input', { type: 'month', value: S.month, onchange: (e) => { if (e.target.value) { S.month = e.target.value; render() } } }))),
    h('table', {}, h('thead', {}, h('tr', {}, ['Propiedad', 'Propietario', 'Reservas', 'Facturado', 'Comisión %', 'Comisión ORIGEN', 'Para el propietario'].map((t) => h('th', { scope: 'col' }, t)))), h('tbody', {}, rows)))
}

/* ---------- Canales (iCal) ---------- */
function vCan() {
  const exportUrl = (c) => `${SUPABASE_URL}/functions/v1/ical-export?t=${c.export_token}`
  return h('div', {}, h('div', { class: 'card' }, h('h2', {}, 'Canales y calendarios iCal'),
    h('p', { class: 'mut' }, 'Por cada unidad y canal: pegá acá el link iCal que te da el canal (importar) y copiá el link "para el canal" en la configuración de calendario del canal (exportar), así cada uno bloquea las fechas de los demás.')),
    S.units.map((u) => h('div', { class: 'card' }, h('h3', {}, `${S.props.find((p) => p.id === u.property_id)?.name} · ${u.name}`),
      S.channels.filter((c) => c.unit_id === u.id).map((c) => {
        const f = h('form', { class: 'row', onsubmit: async (e) => {
          e.preventDefault()
          const { error } = await db.from('channels').update({ name: f.name.value, ical_url: f.ical_url.value.trim() || null }).eq('id', c.id)
          S.msg = error ? error.message : 'Canal guardado'; reload()
        } },
          h('label', {}, 'Canal', h('select', { name: 'name' }, SOURCES.filter((s) => s !== 'Directo').map((s) => h('option', { selected: s === c.name }, s)))),
          h('label', { style: 'flex:1;min-width:240px' }, 'Importar: link iCal del canal', h('input', { name: 'ical_url', type: 'url', value: c.ical_url ?? '', placeholder: 'https://…/calendar.ics' })),
          h('label', { style: 'flex:1;min-width:240px' }, 'Exportar: link para pegar en el canal', h('input', { class: 'url', readonly: true, value: exportUrl(c), onfocus: (e) => e.target.select() })),
          h('button', { class: 'btn', type: 'submit' }, 'Guardar'),
          h('button', { class: 'btn ol', type: 'button', onclick: async () => { if (confirm('¿Quitar este canal?')) { await db.from('channels').delete().eq('id', c.id); reload() } } }, 'Quitar'),
          h('span', { class: 'mut', style: 'flex-basis:100%' }, c.last_sync ? `Última sync: ${new Date(c.last_sync).toLocaleString('es-AR')} · ${c.last_status}` : 'Sin sincronizar'))
        return f
      }),
      h('button', { class: 'btn ol', onclick: async () => { await db.from('channels').insert({ unit_id: u.id, name: 'Airbnb' }); reload() } }, '+ Agregar canal'))))
}

/* ---------- Alojamientos ---------- */
function vAlo() {
  const fp = h('form', { class: 'row', onsubmit: async (e) => {
    e.preventDefault()
    const { error } = await db.from('properties').insert({ name: fp.name.value, owner_id: fp.owner.value || null, commission_pct: Number(fp.pct.value) })
    S.msg = error ? error.message : 'Propiedad creada'; reload()
  } },
    h('label', {}, 'Propiedad', h('input', { name: 'name', required: true, maxlength: 100, placeholder: 'Cabañas El Manantial' })),
    h('label', {}, 'Propietario', h('select', { name: 'owner' }, h('option', { value: '' }, 'Sin asignar'), S.profiles.map((p) => h('option', { value: p.id }, p.email)))),
    h('label', {}, 'Comisión %', h('input', { name: 'pct', type: 'number', min: 0, max: 100, step: '0.5', value: 7, required: true, style: 'width:6rem' })),
    h('button', { class: 'btn', type: 'submit' }, '+ Crear propiedad'))
  const fu = h('form', { class: 'row', onsubmit: async (e) => {
    e.preventDefault()
    const { error } = await db.from('units').insert({ property_id: fu.property.value, name: fu.name.value, capacity: Number(fu.cap.value) || null })
    S.msg = error ? error.message : 'Unidad creada'; reload()
  } },
    h('label', {}, 'Propiedad', h('select', { name: 'property', required: true }, S.props.map((p) => h('option', { value: p.id }, p.name)))),
    h('label', {}, 'Unidad', h('input', { name: 'name', required: true, maxlength: 100, placeholder: 'Cabaña para 4' })),
    h('label', {}, 'Capacidad', h('input', { name: 'cap', type: 'number', min: 1, max: 20, style: 'width:6rem' })),
    h('button', { class: 'btn', type: 'submit' }, '+ Crear unidad'))
  return h('div', {}, h('div', { class: 'card' }, h('h2', {}, 'Propiedades'), fp,
    h('table', {}, h('thead', {}, h('tr', {}, ['Propiedad', 'Propietario', 'Comisión'].map((t) => h('th', { scope: 'col' }, t)))), h('tbody', {}, S.props.map((p) => h('tr', {}, h('td', {}, p.name), h('td', {}, S.profiles.find((x) => x.id === p.owner_id)?.email ?? '—'), h('td', {}, p.commission_pct + '%')))))),
    h('div', { class: 'card' }, h('h2', {}, 'Unidades'), fu,
      h('table', {}, h('thead', {}, h('tr', {}, ['Propiedad', 'Unidad', 'Capacidad'].map((t) => h('th', { scope: 'col' }, t)))), h('tbody', {}, S.units.map((u) => h('tr', {}, h('td', {}, S.props.find((p) => p.id === u.property_id)?.name), h('td', {}, u.name), h('td', {}, u.capacity ?? '—')))))),
    h('p', { class: 'mut' }, 'Para sumar un propietario: creá su usuario en Supabase (Authentication > Users) y después elegilo acá como propietario.'))
}

boot()
</script>
</body>
</html>
